map $arg_v $club_ui_asset_cache {
    default "no-cache";
    "~^[0-9]{8}-[0-9]+$" "public, max-age=2592000, immutable";
}

map $upstream_http_cache_control $club_api_cache_control {
    "" "no-store";
    default $upstream_http_cache_control;
}

# Block direct IP access
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/qpwflhsclub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qpwflhsclub.com/privkey.pem;
    return 444;
}

# HTTPS
server {
    listen 443 ssl;
    server_name qpwflhsclub.com www.qpwflhsclub.com;

    ssl_certificate /etc/letsencrypt/live/qpwflhsclub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qpwflhsclub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;
    server_tokens off;

    location = /booking { return 302 /booking/; }
    location = /booking/account {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /booking/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://$host/ /booking/;
        proxy_read_timeout 30s;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $club_api_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_read_timeout 60s;
    }

    # Static media — long cache, Nginx serves directly
    location ^~ /club-media/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /media/ {
        alias /opt/club-app/media/;
        expires 30d;
        add_header Cache-Control "public";
        etag on;
    }

    # Content-hashed chunks and explicitly versioned UI assets are safe to reuse.
    location ^~ /javascript/ui/chunks/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /javascript/ui/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        expires off;
        add_header Cache-Control $club_ui_asset_cache;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static assets (CSS, JS, images) — cache in browser
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # API and pages
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
    }
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name qpwflhsclub.com www.qpwflhsclub.com;
    return 301 https://$host$request_uri;
}
