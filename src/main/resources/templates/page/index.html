<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/other%20photo/WFL-logo.png">
    <meta name="description" content="QPWFLHS Club - Discover and explore campus clubs at Shanghai Qingpu World Foreign Language High School.">
    <link rel="stylesheet" href="/css/common.css?v=20260909-4">
    <link rel="stylesheet" href="/css/index_style.css?v=20260910-22">
    <link rel="stylesheet" href="/javascript/darkveil/home.css?v=20260909-4">
    <title th:text="#{nav.home}">首页</title>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/notice :: notice}"></div>

    <!-- React Bits DarkVeil background -->
    <div class="bg-viewport" aria-hidden="true">
        <div id="darkveil-background" class="darkveil-layer"></div>
        <div class="darkveil-fallback"></div>
    </div>
    <script defer src="/javascript/darkveil/home.js?v=20260910-22"></script>

    <!-- Scrollable page content -->
    <div class="page-content">

        <!-- Hero -->
        <section class="hero-section">
            <div class="eyebrow">QPWFLHS CLUBS</div>
            <h1 th:text="#{index.title}">让热爱，成为校园日常</h1>
            <p class="hero-subtitle" th:text="#{index.subtitle}">加入喜欢的社团，遇见同频的伙伴，一起创造课堂之外的精彩。</p>
            <a href="/page/search" class="hero-btn" th:text="#{index.btn}">浏览全部社团</a>
        </section>

        <!-- Notice Board -->
        <section class="notice-section glass-card">
            <h2 class="section-title">📋 <span th:text="#{index.notice.title}">公告栏</span></h2>
            <div class="notice-board">
                <div class="notice-important" th:text="#{index.notice.1}">恭喜青浦世外高中社团官网正式上线6.3.1版本！</div>
                <div class="notice" th:text="#{index.notice.2}">注册和登录功能已经开放</div>
                <div class="notice" th:text="#{index.notice.3}">青源智造已上线。点击右上角，提出你的创意</div>
            </div>
        </section>

        <!-- Excellent Clubs -->
        <section class="clubs-section glass-card">
            <h2 class="section-title">⭐ <span th:text="#{index.clubs.title}">优秀社团展示</span></h2>
            <div class="scroll-wrapper">
                <div class="fade-left"></div>
                <div class="fade-right"></div>
                <div id="club-scroll" class="scroll-container" role="region" tabindex="0" aria-label="优秀社团展示" th:aria-label="#{index.clubs.title}" aria-busy="true"><div class="club-skeleton"></div><div class="club-skeleton"></div><div class="club-skeleton"></div></div>
            </div>
        </section>

        <footer class="site-footer">
            <a href="https://beian.miit.gov.cn">沪ICP备2025137067号</a>
        </footer>
    </div>

    <script th:inline="javascript">
        const btnText = /*[[#{button.viewDetail}]]*/ '查看详情';
    </script>
    <script>
        fetch('/api/club/all')
            .then(r => r.json())
            .then(result => {
                const data = Array.isArray(result.data) ? result.data : [];
                const container = document.getElementById('club-scroll');
                const greats = data.filter(c => c.greatClub);
                const source = [...greats, ...data.filter(c => !c.greatClub)].slice(0, Math.max(6,greats.length));
                const items = source;
                container.replaceChildren();container.setAttribute('aria-busy','false');
                items.forEach(c => {
                    const card = document.createElement('a');
                    card.href='/page/clubs/'+Number(c.id);
                    card.className = 'card';
                    const img=document.createElement('img');img.alt=c.clubName;img.loading='lazy';img.decoding='async';img.width=280;img.height=170;
                    const url=new URL(c.clubItem||'/other%20photo/WFL-crest.svg',location.origin);img.src=['http:','https:'].includes(url.protocol)?url.href:'/other%20photo/WFL-crest.svg';
                    img.onerror=()=>{img.onerror=null;img.src='/other%20photo/WFL-crest.svg';};
                    const copy=document.createElement('div');copy.className='card-content';
                    const title=document.createElement('h2');title.textContent=c.clubName;
                    const description=document.createElement('p');description.textContent=c.sortDescription;
                    const link=document.createElement('span');link.className='card-visit';link.textContent=btnText+' ↗';
                    copy.append(title,description,link);card.append(img,copy);
                    container.appendChild(card);
                });
            }).catch(()=>{const box=document.getElementById('club-scroll');box.replaceChildren();const a=document.createElement('a');a.href='/page/search';a.textContent=btnText;box.append(a);box.setAttribute('aria-busy','false');});
    </script>
</body>
</html>
