<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>账号管理后台</title>
    <link rel="icon" type="image/png" href="/other%20photo/WFL-logo.png" />
    <link rel="stylesheet" href="/css/common.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0; /* 留给导航栏 */
            color: #303133;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 24px;
        }
        h2 { margin-bottom: 6px; }
        .subtitle { color: #909399; margin-bottom: 24px; font-size: 14px; }

        /* 卡片网格 */
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .user-card {
            background: #ffffff;
            border: 1px solid #e4e7ed;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* 中文名大，英文名小 */
        .cn-name {
            font-size: 22px;
            font-weight: bold;
            color: #303133;
            margin-bottom: 4px;
        }
        .en-name {
            font-size: 13px;
            color: #909399;
            margin-bottom: 12px;
        }
        /* 身份小标签 */
        .role-tag {
            display: inline-block;
            padding: 2px 8px;
            font-size: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            width: fit-content;
        }
        .role-0 { background: #ecf5ff; color: #409eff; }
        .role-1 { background: #fdf6ec; color: #e6a23c; }
        .role-2 { background: #f0f9eb; color: #67c23a; }
        .role-3 { background: #fef0f0; color: #f56c6c; }

        .card-actions {
            text-align: right;
            border-top: 1px solid #f2f6fc;
            padding-top: 12px;
        }
        .delete-btn {
            background: #ffffff;
            color: #f56c6c;
            border: 1px solid #fbc4c4;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover { background: #f56c6c; color: white; }

        /* 二级确认弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-box {
            background: #ffffff;
            width: 420px;
            border-radius: 8px;
            padding: 24px;
        }
        .user-details {
            background: #f8f9fa;
            padding: 14px;
            border-radius: 6px;
            font-size: 14px;
            margin: 16px 0;
            line-height: 1.8;
        }
        .club-badge {
            display: inline-block;
            background: #e1f3d8;
            color: #67c23a;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 6px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
        .btn-cancel { background: white; border: 1px solid #dcdfe6; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .btn-confirm { background: #f56c6c; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <script>console.log(session.currentUser);</script>
    <h2>恶意注册账号清理后台</h2>
    <div class="subtitle">当前账号级别支持管理权限。用户列表按用户名中文自然排序。</div>

    <div class="user-grid" id="userGrid">
    </div>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
        <h3 style="color: #f56c6c; margin-top:0;">⚠️ 确认要永久删除该账号吗？</h3>
        <div class="user-details">
            <div><strong>账号名字：</strong> <span id="modalUsername"></span></div>
            <div><strong>英文代号：</strong> <span id="modalUsernameEn"></span></div>
            <div><strong>电子邮箱：</strong> <span id="modalEmail"></span></div>
            <div style="margin-top: 8px;"><strong>所属社团：</strong></div>
            <div id="modalClubs" style="margin-top: 5px;"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-confirm" id="btnDoDelete">确定删除</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let currentUserToDelete = null;

    // 只有当有权限时，JS 才会执行初始化请求
    // 这里的 Thymeleaf 表达式可以在 JS 里做一层安全防护
    const hasAuth = /*[[${session.currentUser != null && session.currentUser.userRight >= 2}]]*/ false;

    if (hasAuth) {
        document.addEventListener("DOMContentLoaded", () => {
            loadUsers();
        });
    }

    function loadUsers() {
        fetch('/api/user/all')
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) { renderGrid(res.data); }
            });
    }

    function renderGrid(users) {
        const grid = document.getElementById("userGrid");
        grid.innerHTML = "";
        users.forEach(user => {
            let roleName = "普通学生"; let roleClass = "role-0";
            if (user.userRight === 1) { roleName = "社长/副社长"; roleClass = "role-1"; }
            else if (user.userRight === 2) { roleName = "指导老师"; roleClass = "role-2"; }
            else if (user.userRight === 3) { roleName = "管理员"; roleClass = "role-3"; }

            const card = document.createElement("div");
            card.className = "user-card";
            card.innerHTML = `
                    <div>
                        <div class="cn-name">${user.username || '未填写'}</div>
                        <div class="en-name">@${user.usernameEn || '无'}</div>
                        <div class="role-tag ${roleClass}">${roleName}</div>
                    </div>
                    <div class="card-actions">
                        <button class="delete-btn">删除账号</button>
                    </div>
                `;
            card.querySelector(".delete-btn").addEventListener("click", () => openModal(user));
            grid.appendChild(card);
        });
    }

    function openModal(user) {
        currentUserToDelete = user;
        document.getElementById("modalUsername").innerText = user.username || "未设置";
        document.getElementById("modalUsernameEn").innerText = user.usernameEn || "无";
        document.getElementById("modalEmail").innerText = user.email || "未绑定";

        const clubBox = document.getElementById("modalClubs");
        clubBox.innerHTML = "";
        if (user.clubs && user.clubs.length > 0) {
            user.clubs.forEach(club => {
                const badge = document.createElement("span");
                badge.className = "club-badge";
                badge.innerText = club.clubName;
                clubBox.appendChild(badge);
            });
        } else {
            clubBox.innerHTML = "<span style='color:#909399; font-style:italic;'>未加入任何社团</span>";
        }
        document.getElementById("confirmModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("confirmModal").style.display = "none";
        currentUserToDelete = null;
    }

    document.getElementById("btnDoDelete").addEventListener("click", () => {
        if (!currentUserToDelete) return;
        fetch('/api/user/delete', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usernameEn: currentUserToDelete.usernameEn })
        })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    alert("账号已成功清理！");
                    closeModal();
                    loadUsers();
                } else { alert("操作失败：" + res.message); }
            });
    });
</script>
</body>
</html>
