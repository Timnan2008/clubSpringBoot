<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>账号管理后台</title>
    <link rel="icon" type="image/png" href="/other%20photo/WFL-logo.png" />
    <link rel="stylesheet" href="/css/common.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0; /* 留给导航栏 */
            color: #303133;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 24px;
        }
        h2 { margin-bottom: 6px; }
        .subtitle { color: #909399; margin-bottom: 24px; font-size: 14px; }

        /* 卡片网格 */
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .user-card {
            background: #ffffff;
            border: 1px solid #e4e7ed;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* 中文名大，英文名小 */
        .cn-name {
            font-size: 22px;
            font-weight: bold;
            color: #303133;
            margin-bottom: 4px;
        }
        .en-name {
            font-size: 13px;
            color: #909399;
            margin-bottom: 12px;
        }
        /* 身份小标签 */
        .role-tag {
            display: inline-block;
            padding: 2px 8px;
            font-size: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            width: fit-content;
        }
        .role-0 { background: #ecf5ff; color: #409eff; }
        .role-1 { background: #fdf6ec; color: #e6a23c; }
        .role-2 { background: #f0f9eb; color: #67c23a; }
        .role-3 { background: #fef0f0; color: #f56c6c; }

        .card-actions {
            text-align: right;
            border-top: 1px solid #f2f6fc;
            padding-top: 12px;
        }
        .delete-btn {
            background: #ffffff;
            color: #f56c6c;
            border: 1px solid #fbc4c4;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover { background: #f56c6c; color: white; }

        .change-role-btn {
            background: #ffffff;
            color: #67c23a;
            border: 1px solid #b3e6ab;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
        }
        .change-role-btn:hover { background: #67c23a; color: white; }

        .appoint-president-btn {
            background: #ffffff;
            color: #e6a23c;
            border: 1px solid #e6d8a2;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
        }
        .appoint-president-btn:hover { background: #e6a23c; color: white; }

        .appoint-vice-btn {
            background: #ffffff;
            color: #909399;
            border: 1px solid #dcdfe6;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
        }
        .appoint-vice-btn:hover { background: #909399; color: white; }

        /* 二级确认弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-box {
            background: #ffffff;
            width: 420px;
            border-radius: 8px;
            padding: 24px;
        }
        .user-details {
            background: #f8f9fa;
            padding: 14px;
            border-radius: 6px;
            font-size: 14px;
            margin: 16px 0;
            line-height: 1.8;
        }
        .club-badge {
            display: inline-block;
            background: #e1f3d8;
            color: #67c23a;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 6px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
        .btn-cancel { background: white; border: 1px solid #dcdfe6; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .btn-confirm { background: #f56c6c; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <script>console.log(session.currentUser);</script>
    <h2>用户管理</h2>
    <div class="subtitle">当前账号级别支持管理权限。用户列表按数字-字母-汉字排序。</div>

    <div class="user-grid" id="userGrid">
    </div>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
        <h3 style="color: #f56c6c; margin-top:0;">⚠️ 确认要永久删除该账号吗？</h3>
        <div class="user-details">
            <div><strong>账号名字：</strong> <span id="modalUsername"></span></div>
            <div><strong>英文代号：</strong> <span id="modalUsernameEn"></span></div>
            <div><strong>电子邮箱：</strong> <span id="modalEmail"></span></div>
            <div style="margin-top: 8px;"><strong>所属社团：</strong></div>
            <div id="modalClubs" style="margin-top: 5px;"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-confirm" id="btnDoDelete">确定删除</button>
        </div>
    </div>
</div>

<!-- 改变职位弹窗 -->
<div class="modal-overlay" id="changeRoleModal">
    <div class="modal-box">
        <h3 style="color: #409eff; margin-top:0;">🔄 改变用户职位</h3>
        <div class="user-details">
            <div><strong>用户：</strong> <span id="roleModalUsername"></span></div>
            <div><strong>当前职位：</strong> <span id="roleModalCurrentRole"></span></div>
            <div style="margin-top: 12px;">
                <strong>目标职位：</strong>
                <select id="roleSelect" style="margin-left: 8px; padding: 4px 8px; border-radius: 4px; border: 1px solid #dcdfe6;">
                    <option value="0">普通用户</option>
                    <option value="2">指导老师</option>
                    <option value="3">管理员</option>
                </select>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeRoleModal()">取消</button>
            <button class="btn-confirm" id="btnDoChangeRole" style="background: #409eff;">确认修改</button>
        </div>
    </div>
</div>

<!-- 任命社长弹窗 -->
<div class="modal-overlay" id="appointModal">
    <div class="modal-box">
        <h3 style="color: #e6a23c; margin-top:0;" id="appointModalTitle">👑 任命社长</h3>
        <div class="user-details">
            <div><strong>用户：</strong> <span id="appointModalUsername"></span></div>
            <div><strong>当前职位：</strong> <span id="appointModalCurrentRole"></span></div>
            <div><strong>任命类型：</strong> <span id="appointModalType" style="color: #e6a23c; font-weight: bold;"></span></div>
            <div style="margin-top: 12px;">
                <strong>选择社团：</strong>
                <select id="appointClubSelect" style="margin-left: 8px; padding: 4px 8px; border-radius: 4px; border: 1px solid #dcdfe6; width: 200px;">
                </select>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeAppointModal()">取消</button>
            <button class="btn-confirm" id="btnDoAppoint" style="background: #e6a23c;">确认任命</button>
        </div>
    </div>
</div>

<!-- 撤销社长弹窗 -->
<div class="modal-overlay" id="revokeModal">
    <div class="modal-box">
        <h3 style="color: #f56c6c; margin-top:0;" id="revokeModalTitle">🔻 撤销社长</h3>
        <div class="user-details">
            <div><strong>用户：</strong> <span id="revokeModalUsername"></span></div>
            <div><strong>当前职位：</strong> <span id="revokeModalCurrentRole"></span></div>
            <div style="margin-top: 12px;">
                <strong>选择社团：</strong>
                <select id="revokeClubSelect" style="margin-left: 8px; padding: 4px 8px; border-radius: 4px; border: 1px solid #dcdfe6; width: 200px;">
                </select>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeRevokeModal()">取消</button>
            <button class="btn-confirm" id="btnDoRevoke" style="background: #f56c6c;">确认撤销</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let currentUserToDelete = null;
    let currentUserToChangeRole = null;
    let currentUserToAppoint = null;
    let allClubs = [];
    let teacherManagedClubs = [];

    // 权限判断（Thymeleaf 表达式）
    const hasAuth = /*[[${loginUser != null && loginUser.getUserRight() >= 2}]]*/ false;
    const isAdmin = /*[[${loginUser != null && loginUser.getUserRight() == 3}]]*/ false;
    const canAppoint = /*[[${loginUser != null && loginUser.getUserRight() >= 2}]]*/ false;
    const loginUserClubs = /*[[${loginUser != null ? loginUser.clubs : null}]]*/ null;

    // 初始化逻辑
    if (hasAuth) {
        document.addEventListener("DOMContentLoaded", () => {
            loadUsers();
            loadClubs();
        });
    }

    function loadClubs() {
        fetch('/api/club/all')
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    allClubs = res.data;
                }
            });
    }

    function loadUsers() {
        fetch('/api/user/all')
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) { renderGrid(res.data); }
            });
    }

    function renderGrid(users) {
            const grid = document.getElementById("userGrid");
            grid.innerHTML = "";
            users.forEach(user => {
                let roleName = "普通学生"; let roleClass = "role-0";
                if (user.userRight === 1) { roleName = "社长/副社长"; roleClass = "role-1"; }
                else if (user.userRight === 2) { roleName = "指导老师"; roleClass = "role-2"; }
                else if (user.userRight === 3) { roleName = "管理员"; roleClass = "role-3"; }

                // 管理员额外显示改变职位按钮
                let roleBtnHtml = "";
                if (isAdmin) {
                    roleBtnHtml = '<button class="change-role-btn">改变职位</button>';
                }

                // 老师和管理员可以任命社长/副社长（不能任命老师和管理员）
                let appointBtnHtml = "";
                if (canAppoint && user.userRight !== 2 && user.userRight !== 3) {
                    appointBtnHtml = '<button class="appoint-president-btn">任命社长</button><button class="appoint-vice-btn">任命副社长</button>';
                }

                // 老师和管理员可以撤销社长/副社长（只能撤销社长）
                let revokeBtnHtml = "";
                if (canAppoint && user.userRight === 1) {
                    revokeBtnHtml = '<button class="revoke-president-btn">撤销社长</button>';
                }

                // 社长额外显示主社团社长信息
                let clubInfoHtml = "";
                if (user.userRight === 1 && user.clubs && user.clubs.length > 0) {
                    try {
                        const mainClubId = user.mainClubId || (user.mainClub && user.mainClub.id);
                        // 找到主社团
                        const mainClub = user.clubs.find(c => c.id === mainClubId);
                        if (mainClub) {
                            // 显示格式：XX社社长 或 XX社副社长
                            const roleText = user.vicePresident ? '副社长' : '社长';
                            clubInfoHtml = `<div style="margin-top: 8px; font-size: 12px; color: #67c23a;">${mainClub.clubName}${roleText}</div>`;
                        }
                    } catch (e) {
                        console.log('Error rendering club info:', e);
                    }
                }

                const card = document.createElement("div");
                card.className = "user-card";
                card.innerHTML = `
                        <div>
                            <div class="cn-name">${user.username || '未填写'}</div>
                            <div class="en-name">@${user.usernameEn || '无'}</div>
                            <div class="role-tag ${roleClass}">${roleName}</div>
                            ${clubInfoHtml}
                        </div>
                        <div class="card-actions">
                            <button class="delete-btn">删除账号</button>
                            ${roleBtnHtml}
                            ${appointBtnHtml}
                            ${revokeBtnHtml}
                        </div>
                    `;
            card.querySelector(".delete-btn").addEventListener("click", () => openModal(user));
            if (isAdmin) {
                card.querySelector(".change-role-btn").addEventListener("click", () => openRoleModal(user));
            }
            if (canAppoint && user.userRight !== 2 && user.userRight !== 3) {
                card.querySelector(".appoint-president-btn").addEventListener("click", () => openAppointModal(user, false));
                card.querySelector(".appoint-vice-btn").addEventListener("click", () => openAppointModal(user, true));
            }
            if (canAppoint && user.userRight === 1) {
                card.querySelector(".revoke-president-btn").addEventListener("click", () => openRevokeModal(user));
            }
            grid.appendChild(card);
        });
    }

    function openModal(user) {
        currentUserToDelete = user;
        document.getElementById("modalUsername").innerText = user.username || "未设置";
        document.getElementById("modalUsernameEn").innerText = user.usernameEn || "无";
        document.getElementById("modalEmail").innerText = user.email || "未绑定";

        const clubBox = document.getElementById("modalClubs");
        clubBox.innerHTML = "";
        if (user.clubs && user.clubs.length > 0) {
            user.clubs.forEach(club => {
                const badge = document.createElement("span");
                badge.className = "club-badge";
                badge.innerText = club.clubName;
                clubBox.appendChild(badge);
            });
        } else {
            clubBox.innerHTML = "<span style='color:#909399; font-style:italic;'>未加入任何社团</span>";
        }
        document.getElementById("confirmModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("confirmModal").style.display = "none";
        currentUserToDelete = null;
    }

    document.getElementById("btnDoDelete").addEventListener("click", () => {
        if (!currentUserToDelete) return;
        fetch('/api/user/delete', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usernameEn: currentUserToDelete.usernameEn })
        })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    alert("账号已成功清理！");
                    closeModal();
                    loadUsers();
                } else { alert("操作失败：" + res.message); }
            });
    });

    // 改变职位相关函数
    function getRoleName(role) {
        if (role === 0) return "普通学生";
        if (role === 1) return "社长/副社长";
        if (role === 2) return "指导老师";
        if (role === 3) return "管理员";
        return "未知";
    }

    function openRoleModal(user) {
        currentUserToChangeRole = user;
        document.getElementById("roleModalUsername").innerText = user.username || "未设置";
        document.getElementById("roleModalCurrentRole").innerText = getRoleName(user.userRight);
        // 设置下拉框默认值（排除当前角色）
        const select = document.getElementById("roleSelect");
        select.value = user.userRight === 0 ? "2" : "0"; // 默认选中不同的角色
        document.getElementById("changeRoleModal").style.display = "flex";
    }

    function closeRoleModal() {
        document.getElementById("changeRoleModal").style.display = "none";
        currentUserToChangeRole = null;
    }

    document.getElementById("btnDoChangeRole").addEventListener("click", () => {
        if (!currentUserToChangeRole) return;
        const newRole = parseInt(document.getElementById("roleSelect").value);
        
        if (newRole === currentUserToChangeRole.userRight) {
            alert("目标职位与当前职位相同，请选择其他职位");
            return;
        }

        fetch('/api/user/change-role', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                usernameEn: currentUserToChangeRole.usernameEn, 
                newRole: newRole 
            })
        })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    alert("职位已成功修改！");
                    closeRoleModal();
                    loadUsers();
                } else { alert("操作失败：" + res.message); }
            });
    });

    // 任命社长相关函数
    let currentAppointIsVice = false;
    
    function openAppointModal(user, isVice) {
        currentUserToAppoint = user;
        currentAppointIsVice = isVice;
        
        document.getElementById("appointModalUsername").innerText = user.username || "未设置";
        document.getElementById("appointModalCurrentRole").innerText = getRoleName(user.userRight);
        document.getElementById("appointModalType").innerText = isVice ? "副社长" : "社长";
        
        // 设置弹窗标题
        const title = document.getElementById("appointModalTitle");
        title.innerText = isVice ? "👑 任命副社长" : "👑 任命社长";
        
        // 填充社团下拉列表
        const clubSelect = document.getElementById("appointClubSelect");
        clubSelect.innerHTML = "";
        
        // 如果是管理员，可以选择所有社团
        // 如果是老师，只能选择自己指导的社团
        let availableClubs = allClubs;
        if (!isAdmin) {
            // 优先使用从后端获取的老师社团列表
            let myManagedClubs = teacherManagedClubs;
            // 如果 teacherManagedClubs 为空，尝试使用 loginUserClubs
            if (myManagedClubs.length === 0 && loginUserClubs && Array.isArray(loginUserClubs)) {
                myManagedClubs = loginUserClubs;
            }
            
            if (myManagedClubs.length > 0) {
                const myClubIds = myManagedClubs.map(c => c.id);
                availableClubs = allClubs.filter(c => myClubIds.includes(c.id));
            } else {
                // 如果都没有，显示一个提示选项
                clubSelect.innerHTML = '<option value="">没有可管理的社团</option>';
                document.getElementById("appointModal").style.display = "flex";
                return;
            }
        }
        
        availableClubs.forEach(club => {
            const option = document.createElement("option");
            option.value = club.id;
            option.innerText = club.clubName;
            clubSelect.appendChild(option);
        });
        
        document.getElementById("appointModal").style.display = "flex";
    }

    function closeAppointModal() {
        document.getElementById("appointModal").style.display = "none";
        currentUserToAppoint = null;
        currentAppointIsVice = false;
    }

    document.getElementById("btnDoAppoint").addEventListener("click", () => {
        if (!currentUserToAppoint) return;
        
        const clubId = parseInt(document.getElementById("appointClubSelect").value);
        
        if (!clubId) {
            alert("请选择社团");
            return;
        }

        fetch('/api/user/appoint-president', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                usernameEn: currentUserToAppoint.usernameEn, 
                clubId: clubId,
                isVicePresident: currentAppointIsVice
            })
        })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    alert(currentAppointIsVice ? "副社长任命成功！" : "社长任命成功！");
                    closeAppointModal();
                    loadUsers();
                } else { alert("操作失败：" + res.message); }
            });
    });

    // 撤销社长相关函数
    let currentUserToRevoke = null;

    function openRevokeModal(user) {
        currentUserToRevoke = user;
        
        document.getElementById("revokeModalUsername").innerText = user.username || "未设置";
        document.getElementById("revokeModalCurrentRole").innerText = getRoleName(user.userRight);
        
        // 填充社团下拉列表
        const clubSelect = document.getElementById("revokeClubSelect");
        clubSelect.innerHTML = "";
        
        // 获取该用户所属的社团列表
        let userClubs = user.clubs || [];
        
        // 如果是管理员，可以撤销任何社团的社长
        // 如果是老师，只能撤销自己指导的社团的社长
        let availableClubs = userClubs;
        if (!isAdmin) {
            let myManagedClubs = teacherManagedClubs;
            if (myManagedClubs.length === 0 && loginUserClubs && Array.isArray(loginUserClubs)) {
                myManagedClubs = loginUserClubs;
            }
            
            if (myManagedClubs.length > 0) {
                const myClubIds = myManagedClubs.map(c => c.id);
                availableClubs = userClubs.filter(c => myClubIds.includes(c.id));
            } else {
                clubSelect.innerHTML = '<option value="">没有可撤销的社团</option>';
                document.getElementById("revokeModal").style.display = "flex";
                return;
            }
        }
        
        if (availableClubs.length === 0) {
            clubSelect.innerHTML = '<option value="">没有可撤销的社团</option>';
        } else {
            availableClubs.forEach(club => {
                const option = document.createElement("option");
                option.value = club.id;
                option.innerText = club.clubName;
                clubSelect.appendChild(option);
            });
        }
        
        document.getElementById("revokeModal").style.display = "flex";
    }

    function closeRevokeModal() {
        document.getElementById("revokeModal").style.display = "none";
        currentUserToRevoke = null;
    }

    document.getElementById("btnDoRevoke").addEventListener("click", () => {
        if (!currentUserToRevoke) return;
        
        const clubId = parseInt(document.getElementById("revokeClubSelect").value);
        
        if (!clubId) {
            alert("请选择社团");
            return;
        }

        fetch('/api/user/revoke-president', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                usernameEn: currentUserToRevoke.usernameEn, 
                clubId: clubId
            })
        })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    alert("撤销社长成功！");
                    closeRevokeModal();
                    loadUsers();
                } else { alert("操作失败：" + res.message); }
            });
    });
</script>
</body>
</html>
