<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/other%20photo/WFL-logo.png" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/teacher-club-manage_style.css" />
    <title>社团成员管理</title>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div th:replace="fragments/particle :: particle"></div>
<div th:replace="fragments/notice-alarm :: notice26"></div>

<main class="manage-page">
    <section class="manager-panel">
        <header class="manager-header">
            <div>
                <p class="eyebrow-text" th:text="${managerRoleText}">管理账号</p>
                <h1><span th:text="${loginUser.username}">用户</span>的社团管理</h1>
            </div>
            <button class="ghost-btn" type="button" onclick="doLogout()">退出</button>
        </header>

        <div class="managed-summary">
            <div>
                <p class="eyebrow-text">我的社团</p>
                <strong><span th:text="${clubCount}">0</span> 个社团</strong>
            </div>
        </div>

        <div id="club-section-list" class="club-section-list"></div>
    </section>
</main>

<div id="toast" class="toast hidden"></div>

<script th:inline="javascript">
    const MANAGED_CLUBS = /*[[${clubList}]]*/ [];
    const CURRENT_USER_RIGHT = /*[[${userRightValue}]]*/ 0;
    const CURRENT_USER_ID = /*[[${loginUser.id}]]*/ 0;
    const state = { searchTimers: {} };

    document.addEventListener("DOMContentLoaded", () => {
        renderClubSections();
        document.getElementById("club-section-list").addEventListener("input", handleClubSearchInput);
        document.getElementById("club-section-list").addEventListener("click", handleClubActionClick);
        MANAGED_CLUBS.forEach((club) => loadMembers(club.id));
    });

    function renderClubSections() {
        const list = document.getElementById("club-section-list");
        if (!MANAGED_CLUBS.length) {
            list.innerHTML = '<div class="empty-state">暂无可管理社团</div>';
            return;
        }

        list.innerHTML = MANAGED_CLUBS.map((club) => `
            <article class="managed-club-card" data-club-id="${club.id}">
                <header class="club-card-header">
                    <img class="club-avatar" src="${club.clubItem || "/other%20photo/WFL-logo.png"}" alt="">
                    <div class="club-card-title">
                        <p class="eyebrow-text">负责社团</p>
                        <h2>${escapeHtml(club.clubName || club.clubNameEn || "未命名社团")}</h2>
                        <small>${escapeHtml(club.clubNameEn || "")}</small>
                    </div>
                    <span id="member-count-${club.id}" class="club-card-count">成员加载中</span>
                </header>

                <div class="club-card-body">
                    <div class="club-search-row">
                        <input type="search"
                               data-club-search="true"
                               data-club-id="${club.id}"
                               placeholder="搜索学生姓名">
                    </div>
                    <div id="student-results-${club.id}" class="result-list"></div>

                    <div class="panel-title member-title">社团成员</div>
                    <div id="member-list-${club.id}" class="member-list">
                        <div class="empty-state">成员加载中</div>
                    </div>
                </div>
            </article>
        `).join("");
    }

    async function requestJson(url, options = {}) {
        const response = await fetch(url, {
            credentials: "same-origin",
            ...options
        });
        const result = await response.json();
        if (result.code !== 200) {
            throw new Error(result.message || "请求失败");
        }
        return result.data;
    }

    async function loadMembers(clubId) {
        try {
            const members = await requestJson(`/api/club/${clubId}/members`);
            renderMembers(clubId, members || []);
        } catch (error) {
            showToast(error.message, "方法与api被调用但加载失败");
        }
    }

    function renderMembers(clubId, members) {
        const memberList = document.getElementById(`member-list-${clubId}`);
        const memberCount = document.getElementById(`member-count-${clubId}`);
        if (memberCount) {
            memberCount.textContent = `${members.length} 名成员`;
        }
        if (!memberList) return;
        if (!members.length) {
            memberList.innerHTML = '<div class="empty-state">暂无成员</div>';
            return;
        }

        memberList.innerHTML = members.map((member) => memberRow(member, "remove", clubId)).join("");
    }

    function handleClubSearchInput(event) {
        const input = event.target.closest("[data-club-search]");
        if (!input) return;

        const clubId = Number(input.dataset.clubId);
        clearTimeout(state.searchTimers[clubId]);
        state.searchTimers[clubId] = setTimeout(() => searchStudents(clubId), 260);
    }

    function handleClubActionClick(event) {
        const button = event.target.closest("[data-action]");
        if (!button) return;

        const clubId = Number(button.dataset.clubId);
        const studentId = Number(button.dataset.userId);
        if (button.dataset.action === "add") {
            addStudent(clubId, studentId);
        }
        if (button.dataset.action === "remove") {
            removeStudent(clubId, studentId);
        }
        if (button.dataset.action === "appoint-president") {
            appointStaffRole(clubId, studentId, "president");
        }
        if (button.dataset.action === "appoint-vice-president") {
            appointStaffRole(clubId, studentId, "vice_president");
        }
        if (button.dataset.action === "revoke-staff-role") {
            appointStaffRole(clubId, studentId, "member");
        }
    }

    async function searchStudents(clubId) {
        const input = document.querySelector(`[data-club-search][data-club-id="${clubId}"]`);
        const resultList = document.getElementById(`student-results-${clubId}`);
        if (!input || !resultList) return;

        const keyword = input.value.trim();
        if (!keyword) {
            resultList.innerHTML = "";
            return;
        }

        try {
            const students = await requestJson(`/api/club/${clubId}/students/search?keyword=${encodeURIComponent(keyword)}`);
            renderSearchResults(clubId, students || []);
        } catch (error) {
            showToast(error.message, "error");
        }
    }

    function renderSearchResults(clubId, students) {
        const resultList = document.getElementById(`student-results-${clubId}`);
        if (!students.length) {
            resultList.innerHTML = '<div class="empty-state">未找到学生</div>';
            return;
        }

        resultList.innerHTML = students
            .map((student) => memberRow(student, student.member ? "added" : "add", clubId))
            .join("");
    }

    function memberRow(member, action, clubId) {
        const userId = Number(member.userId);
        const roleName = roleText(member.roleInClub);
        const canRemove = action === "remove"
            && userId !== CURRENT_USER_ID
            && (CURRENT_USER_RIGHT >= 2 || member.roleInClub === "member");
        const canAppointStaff = action === "remove"
            && userId !== CURRENT_USER_ID
            && CURRENT_USER_RIGHT >= 1;
        const staffActionHtml = canAppointStaff
            ? `<div class="member-action-group">
                    ${member.roleInClub === "president" ? "" : `<button class="staff-btn" type="button" data-action="appoint-president" data-club-id="${clubId}" data-user-id="${userId}">任命社长</button>`}
                    ${member.roleInClub === "vice_president" ? "" : `<button class="staff-btn muted" type="button" data-action="appoint-vice-president" data-club-id="${clubId}" data-user-id="${userId}">任命副社长</button>`}
                    ${member.roleInClub === "president" || member.roleInClub === "vice_president" ? `<button class="staff-btn revoke" type="button" data-action="revoke-staff-role" data-club-id="${clubId}" data-user-id="${userId}">${member.roleInClub === "vice_president" ? "撤销副社长" : "撤销社长"}</button>` : ""}
               </div>`
            : "";
        const actionHtml = canRemove
            ? `<div class="member-actions">${staffActionHtml}<button class="danger-btn" type="button" data-action="remove" data-club-id="${clubId}" data-user-id="${userId}">移出</button></div>`
            : action === "add"
                ? `<button class="primary-btn small" type="button" data-action="add" data-club-id="${clubId}" data-user-id="${userId}">加入</button>`
                : action === "added"
                    ? '<span class="status-pill">已在社团</span>'
                    : "";

        return `
            <div class="member-row">
                <div>
                    <strong>${escapeHtml(member.username || member.usernameEn || "未命名学生")}</strong>
                    <small>${escapeHtml(member.usernameEn || "")}${roleName ? ` · ${roleName}` : ""}</small>
                </div>
                ${actionHtml}
            </div>
        `;
    }

    async function addStudent(clubId, studentId) {
        try {
            await requestJson("/api/club/member/add", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ clubId, userId: studentId })
            });
            showToast("已加入社团");
            await loadMembers(clubId);
            await searchStudents(clubId);
        } catch (error) {
            showToast(error.message, "error");
        }
    }

    async function appointStaffRole(clubId, studentId, roleInClub) {
        const roleName = roleInClub === "vice_president" ? "副社长" : "社长";
        const successMessage = roleInClub === "member" ? "已撤销职务" : `已任命${roleName}`;
        try {
            await requestJson("/api/club/member/update", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ clubId, userId: studentId, roleInClub })
            });
            showToast(successMessage);
            await loadMembers(clubId);
            await searchStudents(clubId);
        } catch (error) {
            showToast(error.message, "error");
        }
    }

    async function removeStudent(clubId, studentId) {
        try {
            await requestJson("/api/club/member/kick", {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ clubId, userId: studentId })
            });
            showToast("已移出社团");
            await loadMembers(clubId);
            await searchStudents(clubId);
        } catch (error) {
            showToast(error.message, "error");
        }
    }

    function roleText(role) {
        if (role === "president") return "社长";
        if (role === "vice_president") return "副社长";
        if (role === "member") return "社员";
        return "";
    }

    function showToast(message, type = "success") {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.className = `toast ${type}`;
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => {
            toast.className = "toast hidden";
        }, 2400);
    }

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value === null || value === undefined ? "" : String(value);
        return div.innerHTML;
    }
</script>
</body>
</html>
