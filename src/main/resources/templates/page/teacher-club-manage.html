<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/other%20photo/WFL-logo.png">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/teacher-club-manage_style.css">
    <title>社团成员管理</title>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div th:replace="fragments/particle :: particle"></div>

<main class="manage-page">
    <section id="login-panel" class="login-panel">
        <h1>社团成员管理</h1>
        <div class="form-grid">
            <input id="login-email" type="email" autocomplete="email" placeholder="管理账号邮箱">
            <input id="login-password" type="password" autocomplete="current-password" placeholder="密码">
        </div>
        <button id="login-btn" class="primary-btn" type="button">登录</button>
        <p id="login-error" class="message-line"></p>
    </section>

    <section id="manager-panel" class="manager-panel hidden">
        <header class="manager-header">
            <div>
                <p id="manager-role" class="eyebrow-text">管理账号</p>
                <h1 id="manager-name">社团成员管理</h1>
            </div>
            <button id="logout-btn" class="ghost-btn" type="button">退出</button>
        </header>

        <div class="managed-summary">
            <div>
                <p class="eyebrow-text">我的社团</p>
                <strong id="club-total">0 个社团</strong>
            </div>
        </div>

        <div id="club-section-list" class="club-section-list"></div>
    </section>
</main>

<div id="toast" class="toast hidden"></div>

<script>
    const state = {
        user: null,
        clubs: [],
        searchTimers: {}
    };

    const roleText = {
        "teacher": "老师",
        "club-president": "社长",
        "admin": "管理员",
        "user": "学生"
    };

    const $ = (id) => document.getElementById(id);

    document.addEventListener("DOMContentLoaded", () => {
        $("login-btn").addEventListener("click", login);
        $("logout-btn").addEventListener("click", logout);
        $("manager-panel").addEventListener("input", handleClubSearchInput);
        $("manager-panel").addEventListener("click", handleClubActionClick);
        loadCurrentUser();
    });

    async function requestJson(url, options = {}) {
        const res = await fetch(url, {
            credentials: "same-origin",
            ...options
        });
        const result = await res.json();
        if (result.code !== 200) {
            throw new Error(result.message || "请求失败");
        }
        return result.data;
    }

    async function login() {
        const email = $("login-email").value.trim();
        const password = $("login-password").value;
        $("login-error").textContent = "";

        if (!email || !password) {
            $("login-error").textContent = "请输入邮箱和密码";
            return;
        }

        try {
            const params = new URLSearchParams({ email, password });
            const user = await requestJson(`/api/user/login?${params.toString()}`, {
                method: "POST"
            });
            setCurrentUser(user);
        } catch (error) {
            $("login-error").textContent = error.message;
        }
    }

    async function loadCurrentUser() {
        try {
            const user = await requestJson("/api/user/current");
            setCurrentUser(user);
        } catch (error) {
            showLoginPanel();
        }
    }

    async function logout() {
        await fetch("/api/user/logout", {
            method: "POST",
            credentials: "same-origin"
        });
        state.user = null;
        state.clubs = [];
        state.searchTimers = {};
        showLoginPanel();
    }

    function setCurrentUser(user) {
        state.user = user;

        if (!["teacher", "club-president", "admin"].includes(user.role)) {
            $("login-error").textContent = "学生账号不能管理社团";
            showLoginPanel();
            return;
        }

        addClass($("login-panel"), "hidden");
        removeClass($("manager-panel"), "hidden");
        $("manager-name").textContent = `${user.username || user.usernameEn || "管理账号"}的社团管理`;
        $("manager-role").textContent = `${roleText[user.role] || "管理"}账号`;
        showNavbarManageLink();
        loadManageableClubs();
    }

    function showLoginPanel() {
        addClass($("manager-panel"), "hidden");
        removeClass($("login-panel"), "hidden");
        $("club-section-list").innerHTML = "";
        $("club-total").textContent = "0 个社团";
        hideNavbarManageLink();
    }

    async function loadManageableClubs() {
        try {
            state.clubs = await requestJson("/api/user/manage/clubs");
            $("club-total").textContent = `${state.clubs.length} 个社团`;

            if (!state.clubs.length) {
                $("club-section-list").innerHTML = `<div class="empty-state">暂无负责社团</div>`;
                return;
            }

            renderClubSections();
            await Promise.all(state.clubs.map((club) => loadMembers(club.id)));
        } catch (error) {
            showToast(error.message, "error");
        }
    }

    function renderClubSections() {
        $("club-section-list").innerHTML = state.clubs.map((club) => `
            <article class="managed-club-card" data-club-id="${club.id}">
                <header class="club-card-header">
                    <img class="club-avatar" src="${club.clubItem || "/other%20photo/WFL-logo.png"}" alt="">
                    <div class="club-card-title">
                        <p class="eyebrow-text">负责社团</p>
                        <h2>${escapeHtml(club.clubName || club.clubNameEn || "未命名社团")}</h2>
                        <small>${escapeHtml(club.clubNameEn || "")}</small>
                    </div>
                    <span id="member-count-${club.id}" class="club-card-count">成员加载中</span>
                </header>

                <div class="club-card-body">
                    <div class="club-search-row">
                        <input type="search"
                               data-club-search="true"
                               data-club-id="${club.id}"
                               placeholder="搜索学生姓名 / 英文名">
                    </div>
                    <div id="student-results-${club.id}" class="result-list"></div>

                    <div class="panel-title member-title">社团成员</div>
                    <div id="member-list-${club.id}" class="member-list">
                        <div class="empty-state">成员加载中</div>
                    </div>
                </div>
            </article>
        `).join("");
    }

    async function loadMembers(clubId) {
        try {
            const members = await requestJson(`/api/user/manage/clubs/${clubId}/members`);
            renderMembers(clubId, members);
        } catch (error) {
            showToast(error.message, "error");
        }
    }

    function renderMembers(clubId, members) {
        const memberList = $(`member-list-${clubId}`);
        const memberCount = $(`member-count-${clubId}`);

        if (memberCount) {
            memberCount.textContent = `${members.length} 名成员`;
        }

        if (!members.length) {
            memberList.innerHTML = `<div class="empty-state">暂无成员</div>`;
            return;
        }

        memberList.innerHTML = members.map((member) => memberRow(member, "remove", clubId)).join("");
    }

    function handleClubSearchInput(event) {
        const input = event.target.closest("[data-club-search]");
        if (!input) return;

        const clubId = Number(input.dataset.clubId);
        clearTimeout(state.searchTimers[clubId]);
        state.searchTimers[clubId] = setTimeout(() => searchStudents(clubId), 260);
    }

    function handleClubActionClick(event) {
        const button = event.target.closest("[data-action]");
        if (!button) return;

        const clubId = Number(button.dataset.clubId);
        const studentId = Number(button.dataset.userId);

        if (button.dataset.action === "add") {
            addStudent(clubId, studentId);
        }

        if (button.dataset.action === "remove") {
            removeStudent(clubId, studentId);
        }
    }

    async function searchStudents(clubId) {
        const input = document.querySelector(`[data-club-search][data-club-id="${clubId}"]`);
        const resultList = $(`student-results-${clubId}`);
        if (!input || !resultList) return;

        const keyword = input.value.trim();
        if (!keyword) {
            resultList.innerHTML = "";
            return;
        }

        try {
            const students = await requestJson(
                `/api/user/manage/clubs/${clubId}/students/search?keyword=${encodeURIComponent(keyword)}`
            );
            renderSearchResults(clubId, students);
        } catch (error) {
            showToast(error.message, "error");
        }
    }

    function renderSearchResults(clubId, students) {
        const resultList = $(`student-results-${clubId}`);

        if (!students.length) {
            resultList.innerHTML = `<div class="empty-state">未找到学生</div>`;
            return;
        }

        resultList.innerHTML = students
            .map((student) => memberRow(student, student.member ? "added" : "add", clubId))
            .join("");
    }

    function memberRow(member, action, clubId) {
        const button = action === "remove"
            ? `<button class="danger-btn" type="button" data-action="remove" data-club-id="${clubId}" data-user-id="${member.id}">移出</button>`
            : action === "add"
                ? `<button class="primary-btn small" type="button" data-action="add" data-club-id="${clubId}" data-user-id="${member.id}">加入</button>`
                : `<span class="status-pill">已在社团</span>`;

        return `
            <div class="member-row">
                <div>
                    <strong>${escapeHtml(member.username || member.usernameEn || "未命名学生")}</strong>
                    <small>${escapeHtml(member.usernameEn || "")}</small>
                </div>
                ${button}
            </div>
        `;
    }

    async function addStudent(clubId, studentId) {
        try {
            await requestJson(`/api/user/manage/clubs/${clubId}/members/${studentId}`, {
                method: "POST"
            });
            showToast("已加入社团");
            await loadMembers(clubId);
            await searchStudents(clubId);
        } catch (error) {
            showToast(error.message, "error");
        }
    }

    async function removeStudent(clubId, studentId) {
        try {
            await requestJson(`/api/user/manage/clubs/${clubId}/members/${studentId}`, {
                method: "DELETE"
            });
            showToast("已移出社团");
            await loadMembers(clubId);
            await searchStudents(clubId);
        } catch (error) {
            showToast(error.message, "error");
        }
    }

    function showToast(message, type = "success") {
        const toast = $("toast");
        toast.textContent = message;
        setElementClass(toast, `toast ${type}`);
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => {
            setElementClass(toast, "toast hidden");
        }, 2400);
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function addClass(element, className) {
        if (!element) return;
        const classNames = getClassNames(element);
        if (!classNames.includes(className)) {
            classNames.push(className);
        }
        setElementClass(element, classNames.join(" "));
    }

    function removeClass(element, className) {
        if (!element) return;
        setElementClass(element, getClassNames(element)
            .filter((item) => item !== className)
            .join(" "));
    }

    function getClassNames(element) {
        return String(element.getAttribute("class") || "")
            .split(/\s+/)
            .filter(Boolean);
    }

    function setElementClass(element, className) {
        if (element) {
            element.setAttribute("class", className);
        }
    }

    function showNavbarManageLink() {
        const manageLink = $("nav-club-manage-link");
        if (manageLink) {
            setElementClass(manageLink, "");
        }
    }

    function hideNavbarManageLink() {
        const manageLink = $("nav-club-manage-link");
        if (manageLink) {
            setElementClass(manageLink, "nav-hidden");
        }
    }
</script>
</body>
</html>
