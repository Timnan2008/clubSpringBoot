<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="/other%20photo/WFL-logo.png">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/suggestion-history_style.css">
  <title th:text="#{advice.history.title}">历史记录</title>
</head>
<body>
  <div th:replace="fragments/navbar :: navbar"></div>

  <main class="sh-main">
    <section class="sh-hero">
      <a class="btn sh-back" th:href="@{/page/suggestion}" th:text="#{advice.history.back}">返回意见箱</a>
      <h1 class="sh-title" th:text="#{advice.history.title}">历史记录</h1>
      <p class="sh-subtitle" th:text="#{advice.history.subtitle}">查看之前提交的意见与反馈。</p>
    </section>

    <section class="sh-filters">
      <button class="btn sh-filter active" type="button" data-filter="all" th:text="#{advice.history.filter.all}">全部</button>
      <button class="btn sh-filter" type="button" data-filter="general" th:text="#{advice.history.filter.general}">一般建议</button>
      <button class="btn sh-filter" type="button" data-filter="bug" th:text="#{advice.history.filter.bug}">Bug</button>
      <button class="btn sh-filter" type="button" data-filter="feature" th:text="#{advice.history.filter.feature}">功能请求</button>
    </section>

    <section id="sh-list" class="sh-list"></section>
  </main>

  <script th:inline="javascript">
    const historyI18n = {
      loading: /*[[#{advice.history.loading}]]*/ '加载中...',
      empty: /*[[#{advice.history.empty}]]*/ '暂无历史记录',
      anonymous: /*[[#{advice.history.anonymous}]]*/ '匿名',
      unknown: /*[[#{advice.history.unknown}]]*/ '未知',
      general: /*[[#{advice.history.filter.general}]]*/ '一般建议',
      bug: /*[[#{advice.history.filter.bug}]]*/ 'Bug',
      feature: /*[[#{advice.history.filter.feature}]]*/ '功能请求'
    };
    // 当前登录人：老师(userRight>=2)/管理员 → 可以看到全部并审核
    const pageUser = {
      isReviewer: /*[[${loginUser != null && loginUser.getUserRight() >= 2}]]*/ false,
      name: /*[[${loginUser != null ? loginUser.username : ''}]]*/ ''
    };
  </script>
  <script>
    const listEl = document.getElementById('sh-list');
    let filterEls = Array.from(document.querySelectorAll('.sh-filter'));
    const STORAGE_KEY = 'wfl_my_ideas_v1';
    let allSuggestions = [];
    let currentFilter = 'all';

    // 审核人(老师/管理员)：追加“待审核 / 已通过”筛选按钮
    if (pageUser.isReviewer) {
      const filtersWrap = document.querySelector('.sh-filters');
      if (filtersWrap) {
        const mk = (label, f) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'btn sh-filter';
          b.dataset.filter = f;
          b.textContent = label;
          return b;
        };
        filtersWrap.appendChild(mk('待审核', 'pending'));
        filtersWrap.appendChild(mk('已通过', 'approved'));
        filterEls = Array.from(document.querySelectorAll('.sh-filter'));
      }
    }

    function badgeText(type) {
      if (type === 'general') return historyI18n.general;
      if (type === 'bug') return historyI18n.bug;
      if (type === 'feature') return historyI18n.feature;
      return type;
    }

    function renderEmpty(message) {
      listEl.innerHTML = '<div class="sh-empty">' + message + '</div>';
    }

    function isAnon(item) {
      return !!(item.anonymous || item.isAnonymous);
    }

    function loadMyIdeas() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function authorText(item) {
      return isAnon(item) ? historyI18n.anonymous : (item.name || historyI18n.unknown);
    }

    async function reviewAction(id, action) {
      if (action === 'pass') {
        if (!confirm('确定「通过」并公开这条意见吗？')) return;
      } else if (!confirm('确定删除这条意见吗？')) return;

      try {
        const url = action === 'pass' ? '/api/suggestion/pass?id=' + id : '/api/suggestion/' + id;
        const method = action === 'pass' ? 'PUT' : 'DELETE';
        const response = await fetch(url, { method: method });
        const result = await response.json();
        if (!response.ok || (result && result.code && result.code !== 200)) {
          throw new Error((result && result.message) || '操作失败');
        }
        alert('操作成功');
        await fetchHistory();
      } catch (error) {
        alert('操作失败：' + error.message);
      }
    }

    function renderList() {
      let data = allSuggestions;
      if (currentFilter !== 'all') {
        data = allSuggestions.filter(item => {
          if (currentFilter === 'general') return item.title === 'general';
          if (currentFilter === 'bug') return item.title === 'bug';
          if (currentFilter === 'feature') return item.title === 'feature';
          if (currentFilter === 'pending') return item.pass !== true;
          if (currentFilter === 'approved') return item.pass === true;
          return true;
        });
      }

      if (!data.length) {
        renderEmpty(historyI18n.empty);
        return;
      }

      listEl.innerHTML = '';
      data.forEach((item, index) => {
        const card = document.createElement('article');
        card.className = 'sh-item';
        card.style.animationDelay = (index * 0.04) + 's';

        const top = document.createElement('div');
        top.className = 'sh-item-top';

        const badge = document.createElement('span');
        badge.className = 'sh-badge sh-badge--' + item.title;
        badge.textContent = badgeText(item.title);
        top.appendChild(badge);

        const author = document.createElement('span');
        author.className = 'sh-author';
        author.textContent = authorText(item);
        top.appendChild(author);

        if (item._mine) {
          const mine = document.createElement('span');
          mine.className = 'sh-badge';
          mine.style.cssText = 'background:#2563eb;color:#fff;';
          mine.textContent = '我的';
          top.appendChild(mine);
        }

        card.appendChild(top);

        const body = document.createElement('p');
        body.className = 'sh-body';
        body.textContent = item.context || '';
        card.appendChild(body);

        if (pageUser.isReviewer) {
          const state = document.createElement('div');
          state.style.cssText = 'font-size:12px;margin-top:8px;color:' + (item.pass ? '#16a34a' : '#f59e0b') + ';';
          state.textContent = item.pass ? '✓ 已通过（公开可见）' : '待审核（仅审核人可见）';
          card.appendChild(state);

          if (!item.pass) {
            const passBtn = document.createElement('button');
            passBtn.type = 'button';
            passBtn.textContent = '通过并公开';
            passBtn.style.cssText = 'margin:8px 8px 0 0;padding:5px 14px;border:none;border-radius:999px;background:#16a34a;color:#fff;cursor:pointer;font-size:13px;';
            passBtn.onclick = function () { reviewAction(item.id, 'pass'); };
            card.appendChild(passBtn);
          }
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.textContent = '删除';
          delBtn.style.cssText = 'margin:8px 0 0;padding:5px 14px;border:none;border-radius:999px;background:#dc2626;color:#fff;cursor:pointer;font-size:13px;';
          delBtn.onclick = function () { reviewAction(item.id, 'delete'); };
          card.appendChild(delBtn);
        }
        listEl.appendChild(card);
      });
    }

    async function fetchHistory() {
      renderEmpty(historyI18n.loading);
      try {
        // 审核人(老师/管理员)：拉全部；其他人：已通过 + 自己本机提交的
        const endpoint = pageUser.isReviewer ? '/api/suggestion/all' : '/api/suggestion/pass_only';
        const response = await fetch(endpoint);
        const result = await response.json();
        if (!response.ok || !Array.isArray(result.data)) {
          throw new Error('fetch failed');
        }

        allSuggestions = result.data.map(function (it) { return Object.assign({}, it); });

        if (!pageUser.isReviewer) {
          const seen = {};
          allSuggestions.forEach(function (it) { seen[it.id] = true; });
          loadMyIdeas().forEach(function (own) {
            if (own && own.id && !seen[own.id]) {
              allSuggestions.push(Object.assign({}, own, {
                title: own.title || 'general',
                _mine: true
              }));
            }
          });
        }

        allSuggestions.sort(function (a, b) { return (b.id || 0) - (a.id || 0); });
        renderList();
      } catch (error) {
        renderEmpty(historyI18n.empty);
      }
    }

    filterEls.forEach((button) => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;
        filterEls.forEach(el => el.classList.remove('active'));
        button.classList.add('active');
        renderList();
      });
    });

    document.addEventListener('DOMContentLoaded', fetchHistory);
  </script>
</body>
</html>
