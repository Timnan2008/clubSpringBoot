<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/other%20photo/WFL-logo.png" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/login_style.css" />
    <title>我的社团 - WFL Club</title>
    <style>
        .clubs-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .page-header {
            color: #333;
            margin-bottom: 30px;
            border-left: 5px solid #4a90e2;
            padding-left: 15px;
        }
        /* 社团卡片网格 */
        .club-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        .club-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .club-card:hover {
            transform: translateY(-5px);
        }
        .club-info {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .club-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
        }
        .club-title h3 { margin: 0 0 5px 0; color: #333; }
        .club-title p { margin: 0; font-size: 12px; color: #888; }
        .role-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 5px;
        }
        .badge-teacher { background: #e6f7ff; color: #1890ff; }
        .badge-president { background: #f6ffed; color: #52c41a; }
        .badge-member { background: #f5f5f5; color: #666; }

        /* 交互按钮区域 */
        .card-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .btn-sm {
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            flex: 1;
            text-align: center;
        }
        .btn-manage { background: #4a90e2; color: white; }
        .btn-leave { background: #ff4d4f; color: white; }
        .btn-join { background: #52c41a; color: white; }

        /* 管理弹窗面板 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .member-list { margin-top: 15px; }
        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div th:replace="fragments/particle :: particle"></div>
<div th:replace="fragments/notice-alarm :: notice26"></div>

<script th:inline="javascript">
    // 动态注入全局身份基础（主要用于拦截或特殊判断）
    const GLOBAL_USER_TYPE = /*[[${loginUser.userType}]]*/ 'user'; // 'teacher' 或 'user'
    const CURRENT_USER_ID = /*[[${loginUser.id}]]*/ 0;
</script>

<div class="clubs-container">
    <div class="page-header">
        <h2 th:text="${loginUser.userType == 'teacher' ? '我管理的社团' : '我的社团中心'}">社团面板</h2>
        <p style="color: #666; font-size: 14px; margin-top: 5px;">在这里查看、加入、退出或管理您的社团团队。</p>
    </div>

    <div class="club-grid">
        <div class="club-card" th:each="club : ${clubList}">
            <div class="club-info">
                <img class="club-logo" th:src="${club.clubItem != null ? club.clubItem : '/other photo/WFL-logo.png'}" alt="Logo" />
                <div class="club-title">
                    <h3 th:text="${club.clubName}">编程社</h3>
                    <p th:text="${club.clubNameEn}">Coding Club</p>

                    <span th:if="${club.currentUserRole == 'teacher'}" class="role-badge badge-teacher">指导老师</span>
                    <span th:if="${club.currentUserRole == 'president' || club.currentUserRole == 'vice_president'}" class="role-badge badge-president">社长团</span>
                    <span th:if="${club.currentUserRole == 'member'}" class="role-badge badge-member">已加入社员</span>
                    <span th:if="${club.currentUserRole == 'none'}" class="role-badge badge-member" style="background:#fff; border:1px solid #ccc;">未加入</span>
                </div>
            </div>

            <div class="card-actions">
                <button th:if="${club.currentUserRole == 'teacher' || club.currentUserRole == 'president' || club.currentUserRole == 'vice_president'}"
                        class="btn-sm btn-manage"
                        th:onclick="openManageModal([[${club.id}]], [[${club.clubName}]], [[${club.currentUserRole}]])">
                    管理成员
                </button>

                <button th:if="${club.currentUserRole == 'member'}"
                        class="btn-sm btn-leave"
                        th:onclick="handleClubAction([[${club.id}]], 'leave')">
                    退出社团
                </button>

                <button th:if="${club.currentUserRole == 'none' && loginUser.userType != 'teacher'}"
                        class="btn-sm btn-join"
                        th:onclick="handleClubAction([[${club.id}]], 'join')">
                    申请加入
                </button>
            </div>
        </div>
    </div>
</div>

<div id="manageModal" class="modal">
    <div class="modal-content">
        <h3 id="modalClubName" style="margin-bottom: 10px;">社团管理</h3>
        <p style="font-size: 12px; color: #888;">您有权限管理社员与修改职位分工。</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;" />

        <div class="member-list" id="modalMemberList">
        </div>

        <button class="submit-btn" style="margin-top: 20px; background: #666;" onclick="closeModal()">关闭</button>
    </div>
</div>

<script>
    let activeClubId = null;
    let activeUserRole = null; // 当前账号在打开的社团里的角色

    /* ───── 1. 学生：加入或退出社团 ───── */
    function handleClubAction(clubId, type) {
        const actionText = type === 'join' ? '申请加入该社团' : '退出该社团';
        if (!confirm(`确定要执行【${actionText}】操作吗？`)) return;

        fetch(`/api/club/${clubId}/action?type=${type}`, { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    openNotice26(false, { title: "操作成功", msg: data.message || "状态已成功同步", subMsg: "" });
                    setTimeout(() => window.location.reload(), 1500);
                } else {
                    openNotice26(false, { title: "操作失败", msg: data.message, subMsg: "" });
                }
            });
    }

    /* ───── 2. 老师/社长：打开社团成员管理 ───── */
    function openManageModal(clubId, clubName, role) {
        activeClubId = clubId;
        activeUserRole = role;
        document.getElementById("modalClubName").textContent = clubName + " - 成员管理";
        document.getElementById("manageModal").style.display = "flex";

        // 渲染成员列表
        loadMembers(clubId);
    }

    function closeModal() {
        document.getElementById("manageModal").style.display = "none";
    }

    // 异步加载社员
    function loadMembers(clubId) {
        const listContainer = document.getElementById("modalMemberList");
        listContainer.innerHTML = "<p style='color:#999;'>正在加载成员列表...</p>";

        fetch(`/api/club/${clubId}/members`)
            .then(r => r.json())
            .then(res => {
                if(res.code !== 200 || !res.data) {
                    listContainer.innerHTML = "<p style='color:red;'>未能加载到成员</p>";
                    return;
                }

                listContainer.innerHTML = "";
                res.data.forEach(m => {
                    // m 结构：userId, username, roleInClub ('president', 'vice_president', 'member')
                    const item = document.createElement("div");
                    item.className = "member-item";

                    // 角色文本映射
                    let roleName = "社员";
                    if (m.roleInClub === 'president') roleName = "社长";
                    if (m.roleInClub === 'vice_president') roleName = "副社长";

                    let actionHtml = '';

                    // 老师权限：能改社长、副社长、以及彻底移出
                    if (GLOBAL_USER_TYPE === 'teacher') {
                        actionHtml = `
                  <select onchange="updateMemberRole(${m.userId}, this.value)">
                    <option value="member" ${m.roleInClub === 'member'?'selected':''}>社员</option>
                    <option value="vice_president" ${m.roleInClub === 'vice_president'?'selected':''}>副社长</option>
                    <option value="president" ${m.roleInClub === 'president'?'selected':''}>社长</option>
                  </select>
                  <button class="btn-sm btn-leave" style="padding:4px 8px; font-size:11px; margin-left:5px;" onclick="kickMember(${m.userId})">移出</button>
                `;
                    }
                    // 社长团权限（正副社长）：可以增减、剔除社员，但正副社长之间不能互相更改职位
                    else if (activeUserRole === 'president' || activeUserRole === 'vice_president') {
                        if (m.roleInClub === 'member') {
                            actionHtml = `<button class="btn-sm btn-leave" style="padding:4px 8px; font-size:11px;" onclick="kickMember(${m.userId})">剔除社员</button>`;
                        } else {
                            actionHtml = `<span style="font-size:12px; color:#aaa;">管理层(无权更改)</span>`;
                        }
                    }

                    item.innerHTML = `
                <div>
                  <strong style="color:#333;">${m.username}</strong>
                  <span style="font-size:12px; color:#888; margin-left:8px;">[${roleName}]</span>
                </div>
                <div>${actionHtml}</div>
              `;
                    listContainer.appendChild(item);
                });
            });
    }

    /* ───── 3. 职位修改 API 交互 ───── */
    function updateMemberRole(targetUserId, newRole) {
        fetch(`/api/club/member/update`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                clubId: activeClubId,
                userId: targetUserId,
                roleInClub: newRole
            })
        }).then(r => r.json()).then(data => {
            if (data.code === 200) {
                loadMembers(activeClubId); // 刷新局部列表
            } else {
                alert(data.message || "更新失败");
            }
        });
    }

    /* ───── 4. 移除/剔除社员 API 交互 ───── */
    function kickMember(targetUserId) {
        if (!confirm("确定要将该成员从社团中移除吗？")) return;

        fetch(`/api/club/member/kick`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                clubId: activeClubId,
                userId: targetUserId
            })
        }).then(r => r.json()).then(data => {
            if (data.code === 200) {
                loadMembers(activeClubId);
            } else {
                alert(data.message || "移除失败");
            }
        });
    }
</script>
</body>
</html>
