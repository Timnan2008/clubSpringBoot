<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/other%20photo/WFL-logo.png" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/login_style.css" />
    <link rel="stylesheet" href="/css/myclub.css" />
    <title>我的社团 - WFL Club</title>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div th:replace="fragments/particle :: particle"></div>
<div th:replace="fragments/notice-alarm :: notice26"></div>

<script th:inline="javascript">
    const GLOBAL_USER_RIGHT = /*[[${userRightValue}]]*/ 0;
    const CURRENT_USER_ID = /*[[${loginUser.id}]]*/ 0;
</script>

<div class="clubs-container">
    <div class="page-header">
        <h2 th:text="${isTeacherOrAdmin ? '我管理的社团' : '我的社团中心'}">社团面板</h2>
        <p style="color: #666; font-size: 14px; margin-top: 5px;">欢迎回来，<span th:text="${loginUser.username}">用户</span></p>
    </div>

    <div class="club-grid">
        <div class="club-card" th:each="club : ${clubList}">
            <div class="club-card-header">
                <img th:src="${club.clubItem}" class="club-avatar" alt="社团Logo" />
                <div class="club-info-meta">
                    <div class="club-name-cn" th:text="${club.clubName}">社团中文名</div>
                    <div class="club-name-en" th:text="${club.clubNameEn}">Club English Name</div>
                </div>
            </div>

            <div class="club-status-bar">
                我的身份:
                <span class="role-badge badge-president" th:if="${club.currentUserRole == 'president'}">社长</span>
                <span class="role-badge badge-vice-president" th:if="${club.currentUserRole == 'vice_president'}">副社长</span>
                <span class="role-badge badge-member" th:if="${club.currentUserRole == 'member'}">社员</span>
                <span class="role-badge badge-teacher" th:if="${club.currentUserRole == 'teacher'}">指导老师</span>
                <span class="role-badge badge-none" th:if="${club.currentUserRole == 'none'}">未加入</span>
            </div>

            <div class="club-card-actions">
                <button th:if="${club.currentUserRole == 'teacher' || club.currentUserRole == 'president' || club.currentUserRole == 'vice_president'}"
                        class="btn-sm btn-manage"
                        th:onclick="openManageModal([[${club.id}]], [[${club.clubName}]])">
                    管理成员
                </button>

                <button th:if="${club.currentUserRole == 'member'}"
                        class="btn-sm btn-leave"
                        th:onclick="handleClubAction([[${club.id}]], 'leave')">
                    退出社团
                </button>

                <button th:if="${club.currentUserRole == 'none' && !isTeacherOrAdmin}"
                        class="btn-sm btn-join"
                        th:onclick="handleClubAction([[${club.id}]], 'join')">
                    申请加入
                </button>
            </div>
        </div>
    </div>
</div>

<div id="manageModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">社团成员管理</h3>
            <span class="close-btn" onclick="closeManageModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="member-list-loading" id="memberLoading">正在加载成员池数据...</div>
            <div class="member-list-container" id="memberListContainer"></div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let activeClubId = null;

    function handleClubAction(clubId, actionType) {
        const msg = actionType === 'join' ? "确定要申请加入该社团吗？" : "确定要退出该社团吗？";
        if (!confirm(msg)) return;

        fetch(`/api/club/${clubId}/action?type=${actionType}`, {
            method: 'POST'
        }).then(res => res.json()).then(data => {
            if (data.code === 200) {
                alert(data.message || "操作成功！");
                window.location.reload();
            } else {
                alert(data.message || "操作失败，请重试");
            }
        });
    }

    function openManageModal(clubId, clubName) {
        activeClubId = clubId;
        document.getElementById('modalTitle').textContent = `【${clubName}】 成员权限架构面板`;
        document.getElementById('manageModal').style.display = 'flex';
        loadMembers(clubId);
    }

    th:inline="javascript"
    function closeManageModal() {
        document.getElementById('manageModal').style.display = 'none';
        activeClubId = null;
    }

    function loadMembers(clubId) {
        const listContainer = document.getElementById('memberListContainer');
        const loadingText = document.getElementById('memberLoading');
        listContainer.innerHTML = '';
        loadingText.style.display = 'block';

        fetch(`/api/club/${clubId}/members`)
            .then(r => r.json())
            .then(res => {
                loadingText.style.display = 'none';
                if (!res.data || res.data.length === 0) {
                    listContainer.innerHTML = '<p style="color:#999; text-align:center;">暂无任何人在该社团中</p>';
                    return;
                }

                res.data.forEach(member => {
                    const item = document.createElement('div');
                    item.className = 'member-item-row';

                    let roleName = "普通社员";
                    if (member.roleInClub === 'president') roleName = "正社长";
                    if (member.roleInClub === 'vice_president') roleName = "副社长";

                    let actionHtml = '';

                    if (member.userId !== CURRENT_USER_ID) {
                        if (GLOBAL_USER_RIGHT >= 2) {
                            actionHtml = `
                <select class="role-select-input" onchange="updateMemberRole(${member.userId}, this.value)">
                  <option value="member" ${member.roleInClub === 'member' ? 'selected' : ''}>设为社员</option>
                  <option value="vice_president" ${member.roleInClub === 'vice_president' ? 'selected' : ''}>设为副社长</option>
                  <option value="president" ${member.roleInClub === 'president' ? 'selected' : ''}>设为正社长</option>
                </select>
                <button class="btn-kick-action" onclick="kickMember(${member.userId})">移出</button>
              `;
                        } else if (GLOBAL_USER_RIGHT === 1 || GLOBAL_USER_RIGHT === 0) {
                            if (member.roleInClub === 'member') {
                                actionHtml = `<button class="btn-kick-action" onclick="kickMember(${member.userId})">踢出社员</button>`;
                            }
                        }
                    }

                    item.innerHTML = `
                <div class="member-user-info">
                  <span class="member-name">${member.username}</span>
                  <span class="member-role-tag tag-${member.roleInClub}">[${roleName}]</span>
                </div>
                <div class="member-action-box">${actionHtml}</div>
              `;
                    listContainer.appendChild(item);
                });
            });
    }

    function updateMemberRole(targetUserId, newRole) {
        fetch(`/api/club/member/update`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                clubId: activeClubId,
                userId: targetUserId,
                roleInClub: newRole
            })
        }).then(r => r.json()).then(data => {
            if (data.code === 200) {
                loadMembers(activeClubId);
            } else {
                alert(data.message || "权限更新失败");
            }
        });
    }

    function kickMember(targetUserId) {
        if (!confirm("确定要将该成员从社团中移除吗？")) return;

        fetch(`/api/club/member/kick`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                clubId: activeClubId,
                userId: targetUserId
            })
        }).then(r => r.json()).then(data => {
            if (data.code === 200) {
                loadMembers(activeClubId);
            } else {
                alert(data.message || "移出失败");
            }
        });
    }
</script>
</body>
</html>
