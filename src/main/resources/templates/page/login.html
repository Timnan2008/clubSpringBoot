<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/other%20photo/WFL-logo.png" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/login_style.css" />
    <title th:text="#{login.pageTitle}">登录 / 注册</title>
  </head>
  <body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div th:replace="fragments/particle :: particle"></div>
    <div th:replace="fragments/notice-alarm :: notice26"></div>

    <!-- 把 i18n 文字注入 JS 变量 -->
    <script th:inline="javascript">
      const I18N = {
        login: /*[[#{login.tab.login}]]*/ "登录",
        register: /*[[#{login.tab.register}]]*/ "注册",
        errorEmail: /*[[#{login.error.email}]]*/ "请输入有效邮箱",
        errorCode: /*[[#{login.error.code}]]*/ "请输入6位验证码",
        errorPwd: /*[[#{login.error.pwd}]]*/ "请输入密码",
        errorRole: /*[[#{login.error.role}]]*/ "请选择身份",
        sendCode: /*[[#{login.btn.sendCode}]]*/ "发送验证码",
        resend: /*[[#{login.btn.resend}]]*/ "重新发送",
        submitting: /*[[#{login.btn.submitting}]]*/ "提交中...",
        loginSuccess: /*[[#{login.msg.loginSuccess}]]*/ "登录成功！",
        loginFail: /*[[#{login.msg.loginFail}]]*/ "邮箱或密码错误",
        btnOk: /*[[#{login.btn.ok}]]*/ "我知道了",
        noticeErrTitle: /*[[#{login.notice.err.title}]]*/ "操作失败",
        noticeSuccessTitle: /*[[#{login.notice.success.title}]]*/ "成功",
        errEmail: /*[[#{login.notice.err.email}]]*/ "邮箱格式错误",
        errCode: /*[[#{login.notice.err.code}]]*/ "验证码错误",
        errPwd: /*[[#{login.notice.err.pwd}]]*/ "密码错误",
        errRole: /*[[#{login.notice.err.role}]]*/ "请选择身份",
        errRoleSub: /*[[#{login.notice.err.roleSub}]]*/ "详情说明...",
        errTeacher: /*[[#{login.notice.err.teacher}]]*/ "身份验证",
        errTeacherSub: /*[[#{login.notice.err.teacherSub}]]*/ "详情说明...",
        errVerify: /*[[#{login.notice.err.verify}]]*/ "验证码未通过",
        errVerifySub: /*[[#{login.notice.err.verifySub}]]*/ "详情说明...",
        errLoginFail: /*[[#{login.notice.err.loginFail}]]*/ "登录失败",
        errLoginFailMsg: /*[[#{login.notice.err.loginFailMsg}]]*/ "用户名或密码错误",
        errNetwork: /*[[#{login.notice.err.network}]]*/ "网络错误",
        errNetworkMsg: /*[[#{login.notice.err.networkMsg}]]*/ "请检查连接",
        successMsg: /*[[#{login.notice.success.msg}]]*/ "操作成功",
        errNetMultiple: /*[[#{login.notice.err.networkSubMsg}]]*/ "如果多次尝试无效请关闭VPN，如果还是无效就说明学校网发力了得回家搞，如果回家搞还是不行的话……联系编程社社员",
        noticeFailTitle: /*[[#{login.notice.fail.title}]]*/ "发送失败", // 新增
      };
    </script>

    <div class="login-container">
      <!-- Tab 切换 -->
      <div class="tab-bar">
        <button
          class="tab-btn active"
          id="tab-login"
          onclick="switchTab('login')"
          th:text="#{login.tab.login}"
        >
          登录
        </button>
        <button
          class="tab-btn"
          id="tab-register"
          onclick="switchTab('register')"
          th:text="#{login.tab.register}"
        >
          注册
        </button>
      </div>

      <!-- ===== 登录表单 ===== -->
      <div id="form-login">
        <div class="row email-row">
          <input
            id="login-email"
            type="email"
            th:placeholder="#{login.field.email}"
          />
        </div>
        <input
          id="login-password"
          type="password"
          th:placeholder="#{login.field.password}"
        />
        <button
          class="submit-btn"
          onclick="doLogin()"
          th:text="#{login.tab.login}"
        >
          登录
        </button>
      </div>

      <!-- ===== 注册表单 ===== -->
      <div id="form-register" style="display: none">
        <div class="row">
          <input id="name" type="text" th:placeholder="#{login.field.nameCn}" />
          <input
            id="nameEn"
            type="text"
            th:placeholder="#{login.field.nameEn}"
          />
        </div>
        <div class="row email-row">
          <input
            id="email"
            type="email"
            th:placeholder="#{login.field.email}"
          />
          <button
            id="sendCodeBtn"
            class="send-code-btn"
            onclick="sendEmailCode()"
            th:text="#{login.btn.sendCode}"
          >
            发送验证码
          </button>
        </div>
        <input
          id="code"
          type="text"
          th:placeholder="#{login.field.code}"
          maxlength="6"
        />
        <input
          id="password"
          type="password"
          th:placeholder="#{login.field.password}"
        />
        <select id="role" onchange="onRoleChange()">
          <option
            value=""
            disabled
            selected
            th:text="#{login.field.rolePlaceholder}"
          >
            请选择身份
          </option>
          <option value="teacher" th:text="#{login.role.teacher}">老师</option>
          <option value="user" th:text="#{login.role.student}">学生</option>
        </select>
        <div id="dynamic-area"></div>
        <button
          class="submit-btn"
          onclick="validateForm()"
          th:text="#{login.tab.register}"
        >
          注册
        </button>
      </div>
    </div>

    <script>
      /* ───── Tab 切换 ───── */
      function switchTab(tab) {
        document.getElementById("form-login").style.display =
          tab === "login" ? "" : "none";
        document.getElementById("form-register").style.display =
          tab === "register" ? "" : "none";
        document
          .getElementById("tab-login")
          .classList.toggle("active", tab === "login");
        document
          .getElementById("tab-register")
          .classList.toggle("active", tab === "register");
      }

      /* ───── 登录 ───── */
      function doLogin() {
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        if (!isValidEmail(email)) {
          openNotice26(false, { title: I18N.noticeErrTitle, msg: I18N.errEmail, subMsg: "" });
          return;
        }
        if (!password) {
          openNotice26(false, { title: I18N.noticeErrTitle, msg: I18N.errPwd, subMsg: "" });
          return;
        }

        const btn = document.querySelector("#form-login .submit-btn");
        btn.disabled = true;
        btn.textContent = I18N.submitting;

        fetch("/api/user/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.code === 200) {
              window.location.href = "/page/index";
            } else {
              openNotice26(false, { title: I18N.errLoginFail, msg: I18N.errLoginFailMsg, subMsg: "" });
            }
          })
          .catch(() => openNotice26(false,
              {
                  title: I18N.noticeErrTitle,
                  msg: I18N.errNetwork,
                  subMsg: I18N.errNetMultiple
              }
          ))
          .finally(() => {
            btn.disabled = false;
            btn.textContent = I18N.login;
          });
      }

      /* ───── 注册：发送验证码 ───── */
      let countdownInterval;
      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      function sendEmailCode() {
        const email = document.getElementById("email").value;
        if (!isValidEmail(email)) {
          alert(I18N.errorEmail);
          return;
        }
        const btn = document.getElementById("sendCodeBtn");
        btn.disabled = true;
        fetch("/api/email/send?email=" + encodeURIComponent(email), {
          method: "POST",
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.code === 200) {
              // 只有后端返回 200 才算真正成功
              openNotice26(false, {
                title: I18N.noticeSuccessTitle,
                msg: data.message || I18N.successMsg,
                subMsg: ""
              });

              let countdown = 60;
              btn.textContent = I18N.resend + "(" + countdown + ")";
              countdownInterval = setInterval(() => {
                countdown--;
                btn.textContent = I18N.resend + "(" + countdown + ")";
                if (countdown <= 0) {
                  clearInterval(countdownInterval);
                  btn.textContent = I18N.sendCode;
                  btn.disabled = false;
                }
              }, 1000);
            } else {
              // 即使 fetch 成功了，但后端业务逻辑失败了（如 Mail server connection failed）
              openNotice26(false, {
                title: I18N.noticeFailTitle,
                msg: data.message || "服务异常", // 这里的 data.message 会显示后端的报错详情
                subMsg: I18N.errNetMultiple
              });
              btn.disabled = false;
            }
          })
          .catch(() => {
            openNotice26(false, { title: I18N.errNetwork, msg: I18N.errNetworkMsg, subMsg: I18N.errNetMultiple });
            btn.disabled = false;
          });
      }

      /* ───── 注册：提交 ───── */
      function validateForm() {
        const email = document.getElementById("email").value;
        const code = document.getElementById("code").value;
        if (!isValidEmail(email)) {
          openNotice26(false, { title: I18N.noticeErrTitle, msg: I18N.errEmail, subMsg: "" });
          return;
        }
        if (code.length !== 6) {
          openNotice26(false, { title: I18N.noticeErrTitle, msg: I18N.errCode, subMsg: "" });
          return;
        }

        const role = document.getElementById("role").value;
        if (!role) {
          openNotice26(false, { title: I18N.errRole, msg: I18N.errRole, subMsg: I18N.errRoleSub });
          return;
        }


        if(role === "teacher"){
          if(email.indexOf("@shwfl.edu.cn") === -1){
            openNotice26(false, { title: I18N.errTeacher, msg: I18N.errTeacher, subMsg: I18N.errTeacherSub });
            return;
          }
        }

        fetch(
          "/api/email/verify?email=" +
            encodeURIComponent(email) +
            "&code=" +
            encodeURIComponent(code),
          { method: "POST" },
        )
          .then((r) => r.json())
          .then((data) => {
              const code = data.code;
              console.log(code)
              if(code === 200){
                  sendPost();
              }else{
                openNotice26(false, { title: I18N.errVerify, msg: I18N.errVerify, subMsg: I18N.errVerifySub });

              }
          })
          .catch((err) => console.error(err));}


      function getValue(id) {
        const el = document.getElementById(id);
        if (!el) return null;
        return el.type === "checkbox" ? el.checked : el.value;
      }

      function getSelectedClubIds(title) {
        return [
          ...document.querySelectorAll(`input[name="${title}"]:checked`),
        ].map((i) => Number(i.value));
      }

      function getFormDataByRole(role) {
        if (role === "teacher") {
          return {
            teacherName: getValue("name"),
            teacherNameEn: getValue("nameEn"),
            teacherPassword: getValue("password"),
            teacherEmail: getValue("email"),
            clubs: getSelectedClubIds("负责的社团（可多选）"),
            userType: "teacher",
          };
        }
        if (role === "user") {
          return {
            username: getValue("name"),
            usernameEn: getValue("nameEn"),
            password: getValue("password"),
            email: getValue("email"),
            userType: "user",
          };
        }
      }

      function sendPost() {
        const role = document.getElementById("role").value;
        const json = getFormDataByRole(role);
        fetch("/api/user/add/" + role, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(json),
        })
          .then((r) => r.json())
          .then((data) => {
              //alert(data.message);
            openNotice26(false, { title: I18N.noticeSuccessTitle, msg: I18N.successMsg, subMsg: "" })
          })
          .catch((err) => console.error(err));
      }
    </script>

    <script type="module">
      function onRoleChange() {
        const role = document.getElementById("role").value;
        const area = document.getElementById("dynamic-area");
        area.innerHTML = "";
        if (role === "teacher") {
          area.appendChild(createClubButton("负责的社团（可多选）", true));
        }
      }
      window.onRoleChange = onRoleChange;

      function createClubButton(title, multiple) {
        const container = document.createElement("div");
        const btn = document.createElement("button");
        btn.textContent = title;
        btn.style.marginBottom = "5px";
        btn.className = "club-select-btn";
        btn.addEventListener("click", () => {
          listDiv.style.display =
            listDiv.style.display === "block" ? "none" : "block";
        });
        container.appendChild(btn);

        const listDiv = document.createElement("div");
        listDiv.className = "club-list-container";
        listDiv.style.display = "none";

        fetch("/api/club/all")
          .then((j) => j.json())
          .then((result) => {
            result.data.forEach((c) => {
              const item = document.createElement("label");
              item.className = "club-item";
              const input = document.createElement("input");
              input.className = "club-checkbox";
              input.type = multiple ? "checkbox" : "radio";
              input.name = title;
              input.value = c.id;
              const img = document.createElement("img");
              img.src = c.clubItem;
              img.className = "club-avatar";
              const textDiv = document.createElement("div");
              textDiv.className = "club-text";
              const cn = document.createElement("div");
              cn.className = "club-name-cn";
              cn.textContent = c.clubName;
              const en = document.createElement("div");
              en.className = "club-name-en";
              en.textContent = c.clubNameEn;
              textDiv.appendChild(cn);
              textDiv.appendChild(en);
              item.appendChild(input);
              item.appendChild(img);
              item.appendChild(textDiv);
              listDiv.appendChild(item);
            });
          });
        container.appendChild(listDiv);
        return container;
      }
    </script>
  </body>
</html>
