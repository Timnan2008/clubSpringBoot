<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/other%20photo/WFL-logo.png" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/login_style.css" />
    <link rel="stylesheet" href="/css/profile.css" />
    <title>管理账号 - WFL Club</title>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div th:replace="fragments/particle :: particle"></div>
<div th:replace="fragments/notice-alarm :: notice26"></div>

<script th:inline="javascript">
    const className = /*[[${loginUser.getClass().getName()}]]*/ '';

    let USER_TYPE = 'user';
    if (className.includes('Teacher')) {
        USER_TYPE = 'teacher';
    } else if (className.includes('ClubPresident')) {
        USER_TYPE = 'clubPresident';
    } else if (className.includes('Admin')) {
        USER_TYPE = 'admin';
    }

    const USER_ID = /*[[${loginUser.id}]]*/ '';

    const USER_NAME = /*[[${loginUser.username}]]*/ '';
    const USER_NAME_EN = /*[[${loginUser.usernameEn}]]*/ '';
    const USER_EMAIL = /*[[${loginUser.email}]]*/ '';
    const USER_PASSWORD = /*[[${loginUser.password}]]*/ '';
    const I18N = {
        noticeErrTitle: "操作失败",
        noticeSuccessTitle: "成功",
        errNetwork: "网络错误",
        errNetMultiple: "如果多次尝试无效请关闭VPN，或联系编程社社员",
    };

    console.log("当前登录类名:", className, "最终识别身份:", USER_TYPE);
</script>

<div class="profile-card">
    <h2 style="text-align: center; margin-bottom: 25px; color: #333;">账号设置</h2>

    <div class="profile-section">
        <div class="section-title">👤 基本信息</div>
        <div class="row">
            <div class="form-group" style="flex: 1; margin-right: 10px;">
                <label>中文名</label>
                <input id="profile-name" type="text" th:value="${loginUser.username}" placeholder="中文名" />
            </div>
            <div class="form-group" style="flex: 1;">
                <label>英文名</label>
                <input id="profile-nameEn" type="text" th:value="${loginUser.usernameEn}" placeholder="英文名" />
            </div>
        </div>
        <div class="form-group">
            <label>绑定邮箱 (不可修改)</label>
            <input id="profile-email" class="static-email" type="email" th:value="${loginUser.email}" readonly />
        </div>
        <button class="submit-btn" onclick="updateProfile()">保存基本信息</button>
    </div>

    <div class="profile-section">
        <div class="section-title">🔒 修改密码</div>
        <div class="form-group">
            <label>新密码</label>
            <input id="new-password" type="password" placeholder="请输入新密码" />
        </div>
        <div class="row email-row">
            <input id="security-code" type="text" placeholder="请输入6位验证码" maxlength="6" />
            <button id="sendProfileCodeBtn" class="send-code-btn" onclick="sendSecurityCode()">发送验证码</button>
        </div>
        <button class="submit-btn" onclick="updatePassword()">确认修改密码</button>
    </div>

    <div class="profile-section">
        <div class="section-title" style="color: #ff4d4f;">⚠️ 危险区域</div>
        <div class="danger-zone">
            <p style="font-size: 13px; color: #ff4d4f; margin-bottom: 10px;">
                注销账号将永久删除您的所有数据且无法恢复。请谨慎操作！
            </p>
            <button class="submit-btn btn-danger" onclick="deleteAccount()">注销此账号</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /* ───── 1. 修改基本信息 ───── */
    function updateProfile() {
        const username = document.getElementById("profile-name").value.trim();
        const usernameEn = document.getElementById("profile-nameEn").value.trim();

        if (!username || !usernameEn) {
            openNotice26(false, { title: I18N.noticeErrTitle, msg: "名字或英文名不能为空", subMsg: "" });
            return;
        }

        const payload = {
            id: USER_ID,
            username: username,
            usernameEn: usernameEn,
            password: USER_PASSWORD,
            email: USER_EMAIL,
            userType: USER_TYPE
        };

        console.log(payload);

        fetch("/api/user/update/" + USER_TYPE, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        })
            .then((r) => r.json())
            .then((data) => {
                if (data.code === 200) {
                    openNotice26(false, { title: I18N.noticeSuccessTitle, msg: "资料更新成功！页面即将刷新", subMsg: "" });
                    setTimeout(() => window.location.reload(), 1500);
                } else {
                    openNotice26(false, { title: I18N.noticeErrTitle, msg: data.message || "更新失败", subMsg: "上传api失败，测试人员可查看控制台" + data});
                }
            })
            .catch(() => openNotice26(false, { title: I18N.noticeErrTitle, msg: I18N.errNetwork, subMsg: I18N.errNetMultiple }));
    }

    /* ───── 2. 发送验证码（安全校验） ───── */
    let countdownInterval;
    function sendSecurityCode() {
        const btn = document.getElementById("sendProfileCodeBtn");
        btn.disabled = true;

        fetch("/api/email/send?email=" + encodeURIComponent(USER_EMAIL), { method: "POST" })
            .then((r) => r.json())
            .then((data) => {
                if (data.code === 200) {
                    openNotice26(false, { title: I18N.noticeSuccessTitle, msg: "验证码已发送至您的注册邮箱", subMsg: "" });
                    let countdown = 60;
                    btn.textContent = "重新发送(" + countdown + ")";
                    countdownInterval = setInterval(() => {
                        countdown--;
                        btn.textContent = "重新发送(" + countdown + ")";
                        if (countdown <= 0) {
                            clearInterval(countdownInterval);
                            btn.textContent = "发送验证码";
                            btn.disabled = false;
                        }
                    }, 1000);
                } else {
                    openNotice26(false, { title: "发送失败", msg: data.message || "服务异常", subMsg: I18N.errNetMultiple });
                    btn.disabled = false;
                }
            })
            .catch(() => {
                openNotice26(false, { title: I18N.errNetwork, msg: I18N.errNetwork, subMsg: I18N.errNetMultiple });
                btn.disabled = false;
            });
    }

    /* ───── 3. 验证并修改密码 ───── */
    function updatePassword() {
        const username = document.getElementById("profile-name").value.trim();
        const usernameEn = document.getElementById("profile-nameEn").value.trim();

        const newPwd = document.getElementById("new-password").value;
        const code = document.getElementById("security-code").value.trim();

        if (!newPwd) {
            openNotice26(false, { title: I18N.noticeErrTitle, msg: "请输入新密码", subMsg: "" });
            return;
        }
        if (code.length !== 6) {
            openNotice26(false, { title: I18N.noticeErrTitle, msg: "请输入6位验证码", subMsg: "" });
            return;
        }

        fetch(`/api/email/verify?email=${encodeURIComponent(USER_EMAIL)}&code=${encodeURIComponent(code)}`, { method: "POST" })
            .then((r) => r.json())
            .then((data) => {
                if (data.code === 200) {
                    const payload = {
                        id: USER_ID,
                        username: username,
                        usernameEn: usernameEn,
                        password: newPwd,
                        email: USER_EMAIL,
                        userType: USER_TYPE
                    };
                    return fetch("/api/user/update/" + USER_TYPE, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload),
                    }).then(r => r.json());
                } else {
                    throw new Error("验证码不正确");
                }
            })
            .then((data) => {
                if(data && data.code === 200){
                    openNotice26(false, { title: I18N.noticeSuccessTitle, msg: "密码修改成功！", subMsg: "" });
                    document.getElementById("new-password").value = "";
                    document.getElementById("security-code").value = "";
                }
            })
            .catch((err) => {
                openNotice26(false, { title: I18N.noticeErrTitle, msg: err.message || "操作失败", subMsg: "" });
            });
    }

    /* ───── 4. 注销账号 ───── */
    function deleteAccount() {
        const code = document.getElementById("security-code").value.trim();
        if (code.length !== 6) {
            openNotice26(false, { title: I18N.noticeErrTitle, msg: "注销账号属于高危操作，请先在‘修改密码’栏目中获取并输入6位邮箱验证码以确认身份", subMsg: "" });
            return;
        }

        if (!confirm("确定要永久注销此账号吗？此操作不可逆！")) {
            return;
        }

        fetch(`/api/email/verify?email=${encodeURIComponent(USER_EMAIL)}&code=${encodeURIComponent(code)}`, { method: "POST" })
            .then((r) => r.json())
            .then((data) => {
                if (data.code === 200) {
                    const userId = /*[[${loginUser.id}]]*/ null;
                    if(!userId) {
                        alert("未获取到合法 user_id 变量");
                        return;
                    }
                    return fetch("/api/user/delete/" + userId, { method: "DELETE" }).then(r => r.json());
                } else {
                    throw new Error("验证码校验失败，拒绝注销");
                }
            })
            .then((data) => {
                if(data && data.code === 200) {
                    alert("账号已成功注销。");
                    document.cookie = "user_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                    window.location.href = "/page/index";
                }
            })
            .catch((err) => {
                openNotice26(false, { title: I18N.noticeErrTitle, msg: err.message, subMsg: "" });
            });
    }
</script>
</body>
</html>
