spring:
  mail:
    host: smtp.qiye.aliyun.com
    port: 465
    username: qpwflhs_cs@shwfl.edu.cn
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # 开启 SSL 连接
          ssl:
            enable: true
          # 显式指定 TLS 协议，防止 JDK 21 握手失败
          ssl.protocols: TLSv1.2
          # 信任所有主机，防止证书校验导致的 EOF
          ssl.trust: smtp.qiye.aliyun.com
          # 增加超时时间，防止因网络波动导致 EOF
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

# 文件上传配置
# Windows开发环境会自动使用 ./uploads 目录
# Linux服务器会自动使用 /opt/club-app/media
file:
  upload-dir: