spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Private club workspace metadata/files (single application instance).
club.workspace-dir=${CLUB_WORKSPACE_DIR:./data/club-workspace}

club.social-dir=${CLUB_SOCIAL_DIR:./data/campus-social}

# Compress script, styles and API responses; keep account-dependent pages uncached.
spring.web.resources.cache.cachecontrol.no-cache=true

# Bound memory, response transfer and logging costs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/plain,text/css,application/javascript,text/javascript,application/json,image/svg+xml
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
server.tomcat.threads.max=80
server.tomcat.threads.min-spare=8
server.error.include-stacktrace=never

# Bound queues and idle sockets for the school peak; no device/session-count cap.
server.tomcat.max-connections=1024
server.tomcat.accept-count=256
server.tomcat.connection-timeout=10000
server.tomcat.keep-alive-timeout=15000
server.tomcat.max-keep-alive-requests=100
