<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      *{box-sizing:border-box}body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}
      .tile{position:absolute;inset:70px;border-radius:196px;background:radial-gradient(ellipse at 65% -10%,#9867ff99,transparent 65%),linear-gradient(145deg,#312244,#141224 70%);border:4px solid #9872c955;box-shadow:inset 0 4px 3px #e9d6ff40,0 25px 35px #09051955;overflow:hidden}
      .orbit{position:absolute;width:840px;height:590px;border:2px solid #ba97ed25;border-radius:50%;transform:rotate(-28deg);top:110px;left:40px}
      .orbit.second{transform:rotate(30deg);left:-70px;top:180px}
      img{position:absolute;top:148px;left:236px;width:406px;height:514px;filter:drop-shadow(0 18px 28px #0007)}
      .spark{position:absolute;right:151px;top:145px;width:28px;height:28px;background:#d7b8ff;clip-path:polygon(50% 0,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0 50%,37% 37%)}
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="orbit"></div>
      <div class="orbit second"></div>
      <img src="crest.svg" alt="" />
      <div class="spark"></div>
    </div>
  </body>
</html>
