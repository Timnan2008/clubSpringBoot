                <span>账号管理</span>
              </button>

              <button class="nav-item" type="button" data-path="/page/admin/moderation" data-match="/page/admin/moderation" data-label="违禁词管理" data-min-role="2" title="违禁词管理">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z" />
                  <path d="m9 12 2 2 4-4" />
                </svg>
                <span>违禁词管理</span>
              </button>

              <button class="nav-item" type="button" data-path="/page/suggestion/manage" data-match="/page/suggestion/manage" data-label="建议管理" data-min-role="2" title="建议管理">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="5" y="4" width="14" height="17" rx="2" />
                  <path d="M9 4V3h6v1" />
                  <path d="m9 13 2 2 4-4" />
                </svg>
                <span>建议管理</span>
              </button>
            </section>
          </nav>

          <div class="sidebar-footer">
            <button class="sidebar-toggle" id="sidebar-toggle" type="button" title="收起侧栏">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6" />
              </svg>
              <span>收起侧栏</span>
            </button>
            <div class="sidebar-meta">
              <span>青浦世外社团</span>
              <span>v1.1.5</span>
            </div>
          </div>
        </aside>

        <div class="workspace">
          <header class="workspace-header">
            <form class="workspace-search" id="app-search" role="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
              <input
                id="app-search-input"
                type="search"
                placeholder="搜索社团、活动、成员或公告"
                autocomplete="off"
                aria-label="搜索社团、活动、成员或公告"
              />
              <kbd id="search-shortcut">Ctrl K</kbd>
            </form>

            <div class="workspace-actions">
              <button class="icon-button theme-button" id="theme-toggle" type="button" aria-label="切换到深色模式" title="切换到深色模式">
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="4" />
                  <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z" />
                </svg>
              </button>

              <div class="popover-wrap" id="notification-wrap">
                <button class="icon-button" id="notification-toggle" type="button" aria-label="通知" aria-expanded="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
                    <path d="M10 21h4" />
                  </svg>
                  <span class="top-badge" id="notification-badge" hidden></span>
                </button>
                <section class="popover notification-panel" id="notification-panel" hidden aria-label="通知">
                  <header>
                    <strong>通知</strong>
                    <button id="notification-read-all" type="button">全部已读</button>
                  </header>
                  <div class="notification-list" id="notification-list"></div>
                </section>
              </div>

              <div class="popover-wrap" id="user-wrap">
                <button class="user-button" id="user-toggle" type="button" aria-haspopup="menu" aria-expanded="false">
                  <span class="user-avatar" id="user-avatar">W</span>
                  <span class="user-copy">
                    <strong id="user-name">未登录</strong>
                    <span id="user-role">点击登录</span>
                  </span>
                  <svg class="user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </button>
                <div class="popover user-menu" id="user-menu" hidden role="menu">
                  <div class="user-menu-head">
                    <strong id="menu-name">未登录</strong>
                    <span id="menu-email">登录后同步你的社团数据</span>
                  </div>
                  <a href="/page/user/profile" data-nav role="menuitem">个人资料</a>
                  <a href="/page/my-clubs" data-nav role="menuitem">我的社团</a>
                  <a href="/page/club/workspace" data-nav data-min-role="1" role="menuitem">社团工作台</a>
                  <a href="/page/user-edit" data-nav data-min-role="2" role="menuitem">账号管理</a>
                  <button id="user-login" type="button" role="menuitem">登录 / 注册</button>
                  <button id="user-logout" type="button" role="menuitem" hidden>退出登录</button>
                </div>
              </div>
            </div>
          </header>

          <main class="content">
            <div class="progress" id="progress"></div>
            <webview
              id="club-view"
              webpreferences="contextIsolation=yes, nodeIntegration=no, sandbox=yes"
            ></webview>

            <div class="offline" id="offline" hidden>
              <div class="offline-card">
                <h2>暂时无法连接社团网站</h2>
                <p>请检查网络连接，或确认网站服务是否正常。</p>
                <p class="offline-url" id="offline-url"></p>
                <button class="primary" id="retry" type="button">重新加载</button>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <script src="shell.js"></script>
  </body>
</html>
