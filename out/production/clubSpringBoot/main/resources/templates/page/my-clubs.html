<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/other%20photo/WFL-logo.png" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/login_style.css" />
    <link rel="stylesheet" href="/css/myclub.css" />
    <title>我的社团 - WFL Club</title>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div th:replace="fragments/particle :: particle"></div>
<div th:replace="fragments/notice-alarm :: notice26"></div>

<script th:inline="javascript">
    const GLOBAL_USER_RIGHT = /*[[${userRightValue}]]*/ 0;
    const CURRENT_USER_ID = /*[[${loginUser.id}]]*/ 0;
</script>

<div class="clubs-container">
    <div class="page-header">
        <h2 th:text="${isTeacherOrAdmin ? '我管理的社团' : '我的社团中心'}">社团面板</h2>
        <p style="color: #666; font-size: 14px; margin-top: 5px;">欢迎回来，<span th:text="${loginUser.username}">用户</span></p>
    </div>

    <div class="club-grid">
        <div class="club-card" th:each="club : ${clubList}">
            <div class="club-card-header">
                <img th:src="${club.clubItem}" class="club-avatar" alt="社团Logo" />
                <div class="club-info-meta">
                    <div class="club-name-cn" th:text="${club.clubName}">社团中文名</div>
                    <div class="club-name-en" th:text="${club.clubNameEn}">Club English Name</div>
                </div>
            </div>

            <div class="club-status-bar">
                我的身份:
                <span class="role-badge badge-president" th:if="${club.currentUserRole == 'president'}">社长</span>
                <span class="role-badge badge-vice-president" th:if="${club.currentUserRole == 'vice_president'}">副社长</span>
                <span class="role-badge badge-member" th:if="${club.currentUserRole == 'member'}">社员</span>
                <span class="role-badge badge-teacher" th:if="${club.currentUserRole == 'teacher'}">指导老师</span>
                <span class="role-badge badge-none" th:if="${club.currentUserRole == 'none'}">未加入</span>
                <span class="role-badge badge-admin" th:if="${club.currentUserRole == 'admin'}">管理员</span>
            </div>

            <div class="club-card-actions">
                <button th:if="${club.currentUserRole == 'teacher' || club.currentUserRole == 'admin' || club.currentUserRole == 'president' || club.currentUserRole == 'vice_president'}"
                        class="btn-sm btn-manage"
                        th:onclick="openManageModal([[${club.id}]], [[${club.clubName}]])">
                    管理成员
                </button>

                <button th:if="${club.currentUserRole == 'member'}"
                        class="btn-sm btn-leave"
                        th:onclick="handleClubAction([[${club.id}]], 'leave')">
                    退出社团
                </button>

                <button th:if="${club.currentUserRole == 'none' && !isTeacherOrAdmin}"
                        class="btn-sm btn-join"
                        th:onclick="handleClubAction([[${club.id}]], 'join')">
                    申请加入
                </button>
            </div>

            <div class="club-inline-search"
                 th:if="${club.currentUserRole == 'teacher' || club.currentUserRole == 'admin' || club.currentUserRole == 'president' || club.currentUserRole == 'vice_president'}">
                <div class="club-inline-search-title">添加学生</div>
                <div class="club-inline-search-row">
                    <input class="student-search-input"
                           type="search"
                           placeholder="搜索学生姓名"
                           th:attr="data-club-id=${club.id}"
                           oninput="queueInlineStudentSearch(this)" />
                </div>
                <div class="student-search-results" th:id="'studentSearchResults-' + ${club.id}"></div>
            </div>
        </div>
        <div class="empty-club-state" th:if="${#lists.isEmpty(clubList)}">暂无可管理社团</div>
    </div>
</div>

<div id="manageModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">社团成员管理</h3>
            <span class="close-btn" onclick="closeManageModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="member-search-panel">
                <div class="member-search-row">
                    <input id="modalStudentSearchInput"
                           type="search"
                           placeholder="搜索学生姓名"
                           autocomplete="off" />
                    <button type="button" class="btn-sm btn-manage" onclick="searchModalStudents()">搜索</button>
                </div>
                <div class="student-search-results modal-student-results" id="modalStudentSearchResults"></div>
            </div>
            <div class="member-list-loading" id="memberLoading">正在加载成员池数据...</div>
            <div class="member-list-container" id="memberListContainer"></div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let activeClubId = null;
    let modalSearchTimer = null;
    const inlineSearchTimers = new Map();

    function handleClubAction(clubId, actionType) {
        const msg = actionType === 'join' ? "确定要申请加入该社团吗？" : "确定要退出该社团吗？";
        if (!confirm(msg)) return;

        fetch(`/api/club/${clubId}/action?type=${actionType}`, {
            method: 'POST'
        }).then(res => res.json()).then(data => {
            if (data.code === 200) {
                alert(data.message || "操作成功！");
                window.location.reload();
            } else {
                alert(data.message || "操作失败，请重试");
            }
        }).catch(() => {
            alert("网络异常，请稍后再试");
        });
    }

    function openManageModal(clubId, clubName) {
        activeClubId = clubId;
        document.getElementById('modalTitle').textContent = `【${clubName}】 成员权限架构面板`;
        document.getElementById('manageModal').style.display = 'flex';
        document.getElementById('modalStudentSearchInput').value = '';
        document.getElementById('modalStudentSearchResults').innerHTML = '';
        loadMembers(clubId);
        setTimeout(() => document.getElementById('modalStudentSearchInput').focus(), 80);
    }

    function closeManageModal() {
        document.getElementById('manageModal').style.display = 'none';
        document.getElementById('modalStudentSearchResults').innerHTML = '';
        activeClubId = null;
    }

    document.addEventListener('DOMContentLoaded', () => {
        const modalSearchInput = document.getElementById('modalStudentSearchInput');
        modalSearchInput.addEventListener('input', () => {
            clearTimeout(modalSearchTimer);
            modalSearchTimer = setTimeout(searchModalStudents, 260);
        });
    });

    function loadMembers(clubId) {
        const listContainer = document.getElementById('memberListContainer');
        const loadingText = document.getElementById('memberLoading');
        listContainer.innerHTML = '';
        loadingText.style.display = 'block';

        fetch(`/api/club/${clubId}/members`)
            .then(r => r.json())
            .then(res => {
                loadingText.style.display = 'none';
                if (res.code !== 200) {
                    listContainer.innerHTML = `<p style="color:#c62828; text-align:center;">${escapeHtml(res.message || '成员列表加载失败')}</p>`;
                    return;
                }

                if (!res.data || res.data.length === 0) {
                    listContainer.innerHTML = '<p style="color:#999; text-align:center;">暂无任何人在该社团中</p>';
                    return;
                }

                res.data.forEach(member => {
                    const item = document.createElement('div');
                    item.className = 'member-item-row';

                    let roleName = "普通社员";
                    if (member.roleInClub === 'president') roleName = "正社长";
                    if (member.roleInClub === 'vice_president') roleName = "副社长";

                    let actionHtml = '';

                    if (member.userId !== CURRENT_USER_ID) {
                        if (GLOBAL_USER_RIGHT >= 2) {
                            actionHtml = `
                <select class="role-select-input" onchange="updateMemberRole(${member.userId}, this.value)">
                  <option value="member" ${member.roleInClub === 'member' ? 'selected' : ''}>设为社员</option>
                  <option value="vice_president" ${member.roleInClub === 'vice_president' ? 'selected' : ''}>设为副社长</option>
                  <option value="president" ${member.roleInClub === 'president' ? 'selected' : ''}>设为正社长</option>
                </select>
                <button class="btn-kick-action" onclick="kickMember(${member.userId})">移出</button>
              `;
                        } else if (GLOBAL_USER_RIGHT === 1 || GLOBAL_USER_RIGHT === 0) {
                            if (member.roleInClub === 'member') {
                                actionHtml = `<button class="btn-kick-action" onclick="kickMember(${member.userId})">踢出社员</button>`;
                            }
                        }
                    }

                    item.innerHTML = `
                <div class="member-user-info">
                  <span class="member-name">${escapeHtml(member.username || '未命名')}</span>
                  <span class="member-role-tag tag-${member.roleInClub}">[${roleName}]</span>
                </div>
                <div class="member-action-box">${actionHtml}</div>
              `;
                    listContainer.appendChild(item);
                });
            }).catch(() => {
                loadingText.style.display = 'none';
                listContainer.innerHTML = '<p style="color:#c62828; text-align:center;">成员列表加载失败</p>';
            });
    }

    function queueInlineStudentSearch(input) {
        const clubId = Number(input.dataset.clubId);
        const resultsBox = document.getElementById(`studentSearchResults-${clubId}`);
        clearTimeout(inlineSearchTimers.get(clubId));
        inlineSearchTimers.set(clubId, setTimeout(() => {
            searchStudentsForClub(clubId, input.value, resultsBox);
        }, 260));
    }

    function searchModalStudents() {
        if (!activeClubId) return;
        const input = document.getElementById('modalStudentSearchInput');
        const resultsBox = document.getElementById('modalStudentSearchResults');
        searchStudentsForClub(activeClubId, input.value, resultsBox);
    }

    function searchStudentsForClub(clubId, keyword, resultsBox) {
        const text = (keyword || '').trim();
        if (!resultsBox) return;
        if (!text) {
            resultsBox.innerHTML = '';
            return;
        }

        resultsBox.innerHTML = '<div class="search-loading">搜索中...</div>';
        fetch(`/api/club/${clubId}/students/search?keyword=${encodeURIComponent(text)}`)
            .then(r => r.json())
            .then(res => {
                if (res.code !== 200) {
                    resultsBox.innerHTML = `<div class="search-empty">${escapeHtml(res.message || '搜索失败')}</div>`;
                    return;
                }
                renderStudentSearchResults(clubId, res.data || [], resultsBox);
            })
            .catch(() => {
                resultsBox.innerHTML = '<div class="search-empty">搜索失败，请稍后再试</div>';
            });
    }

    function renderStudentSearchResults(clubId, students, resultsBox) {
        if (!students.length) {
            resultsBox.innerHTML = '<div class="search-empty">没有找到匹配学生</div>';
            return;
        }

        resultsBox.innerHTML = students.map(student => {
            const userId = Number(student.userId);
            const name = escapeHtml(student.username || '未命名学生');
            const enName = student.usernameEn ? `<span class="student-en-name">@${escapeHtml(student.usernameEn)}</span>` : '';
            const action = student.member
                ? '<span class="student-added-pill">已在社团</span>'
                : `<button type="button" class="student-add-btn" onclick="addStudentToClub(${clubId}, ${userId})">加入</button>`;

            return `
                <div class="student-search-row">
                    <div class="student-search-name">
                        <span>${name}</span>
                        ${enName}
                    </div>
                    ${action}
                </div>
            `;
        }).join('');
    }

    function addStudentToClub(clubId, targetUserId) {
        fetch('/api/club/member/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                clubId: clubId,
                userId: targetUserId
            })
        }).then(r => r.json()).then(data => {
            if (data.code === 200) {
                if (activeClubId === clubId) {
                    loadMembers(clubId);
                    searchModalStudents();
                }
                refreshInlineSearch(clubId);
            } else {
                alert(data.message || '添加失败');
            }
        }).catch(() => {
            alert('添加失败，请稍后再试');
        });
    }

    function updateMemberRole(targetUserId, newRole) {
        fetch(`/api/club/member/update`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                clubId: activeClubId,
                userId: targetUserId,
                roleInClub: newRole
            })
        }).then(r => r.json()).then(data => {
            if (data.code === 200) {
                loadMembers(activeClubId);
            } else {
                alert(data.message || "权限更新失败");
            }
        });
    }

    function kickMember(targetUserId) {
        if (!confirm("确定要将该成员从社团中移除吗？")) return;

        fetch(`/api/club/member/kick`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                clubId: activeClubId,
                userId: targetUserId
            })
        }).then(r => r.json()).then(data => {
            if (data.code === 200) {
                loadMembers(activeClubId);
                searchModalStudents();
                refreshInlineSearch(activeClubId);
            } else {
                alert(data.message || "移出失败");
            }
        });
    }

    function refreshInlineSearch(clubId) {
        const input = document.querySelector(`.student-search-input[data-club-id="${clubId}"]`);
        const resultsBox = document.getElementById(`studentSearchResults-${clubId}`);
        if (input && input.value.trim()) {
            searchStudentsForClub(clubId, input.value, resultsBox);
        }
    }

    function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value === null || value === undefined ? '' : String(value);
        return div.innerHTML;
    }
</script>
</body>
</html>
